apiVersion: v1
kind: Service
metadata:
  name: postgresql
spec:
  selector:
    app: postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
        - name: postgresql
          image: postgres:18.4-alpine
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: taskmigo
            - name: POSTGRES_USER
              value: taskmigo
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskmigo-secrets
                  key: database-password
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - taskmigo
                - -d
                - taskmigo
            initialDelaySeconds: 2
            periodSeconds: 2
