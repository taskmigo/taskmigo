services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: taskmigo
      POSTGRES_USER: taskmigo
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in the environment}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmigo -d taskmigo"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql

  console:
    build:
      context: ./console
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/taskmigo
      DATABASE_USERNAME: taskmigo
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in the environment}
      BOOTSTRAP_USERNAME: ${BOOTSTRAP_USERNAME:-developer}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?Set BOOTSTRAP_PASSWORD in the environment}
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:9000}
    ports:
      - "${SERVER_PORT:-9000}:9000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
