spring:
  datasource:
    url: ${TASKMIGO_DATABASE_URL:jdbc:postgresql://localhost:5432/taskmigo}
    username: ${TASKMIGO_DATABASE_USERNAME:taskmigo}
    password: ${TASKMIGO_DATABASE_PASSWORD:taskmigo}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    validate-migration-naming: true

taskmigo:
  security:
    issuer: ${TASKMIGO_ISSUER:http://localhost:8080}
    client-id: ${TASKMIGO_OAUTH_CLIENT_ID:taskmigo-cli}
    client-secret: ${TASKMIGO_OAUTH_CLIENT_SECRET:taskmigo-dev-secret}
