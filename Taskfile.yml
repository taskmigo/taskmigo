version: "3"

vars:
  PROFILE: '{{default "minikube" .PROFILE}}'
  NAMESPACE: '{{default "taskmigo-local" .NAMESPACE}}'
  RELEASE: '{{default "taskmigo" .RELEASE}}'
  GATEWAY_NAME: '{{default "taskmigo-local" .GATEWAY_NAME}}'
  PUBLIC_HOST: '{{default "taskmigo.internal.com" .PUBLIC_HOST}}'
  SERVER_VERSION:
    sh: |
      awk -F'"' '/^[[:space:]]*version = "/ { print $2; exit }' server/build.gradle.kts
  CLIENT_VERSION:
    sh: |
      awk -F'"' '/^[[:space:]]*"version":/ { print $4; exit }' client/package.json
  KUBE_CONTEXT: "{{.PROFILE}}"
  ENVOY_GATEWAY_VERSION: v1.9.1
  HELM: helm
  KUBECTL: 'minikube -p "{{.PROFILE}}" kubectl --'

tasks:
  default:
    desc: Deploy Taskmigo to the default Minikube profile
    cmds:
      - task: kubernetes:deploy

  kubernetes:validate:
    desc: Lint and render every supported Taskmigo chart configuration
    preconditions:
      - sh: command -v helm >/dev/null
        msg: Helm is required. Install it before running this task.
    cmds:
      - |
        set -euo pipefail
        {{.HELM}} lint helm/taskmigo
        {{.HELM}} template taskmigo helm/taskmigo \
          --set tests.enabled=true \
          --set tests.oauthClient.enabled=true \
          --set bootstrap.testClient.enabled=true \
          >/dev/null
        {{.HELM}} template taskmigo helm/taskmigo \
          --set gateway.enabled=true \
          --set gateway.create=true \
          --set gateway.className=test-gateway-class \
          --set-string 'gateway.addresses[0].type=IPAddress' \
          --set-string 'gateway.addresses[0].value=192.0.2.1' \
          >/dev/null
        {{.HELM}} template taskmigo helm/taskmigo \
          --set gateway.enabled=true \
          --set gateway.create=false \
          --set gateway.name=shared-gateway \
          --set gateway.namespace=gateway-system \
          >/dev/null
        {{.HELM}} template taskmigo helm/taskmigo \
          --set gateway.enabled=true \
          --set gateway.create=true \
          --set gateway.className=test-gateway-class \
          --set-string gateway.clientHost=taskmigo.internal.com \
          --set-string gateway.webHost=taskmigo.internal.com \
          >/dev/null

  kubernetes:cluster:ready:
    desc: Wait until the selected Minikube profile is ready
    internal: true
    preconditions:
      - sh: command -v minikube >/dev/null
        msg: Minikube is required. Install it before running this task.
    cmds:
      - |
        set -euo pipefail

        for attempt in $(seq 1 60); do
          if minikube -p "{{.PROFILE}}" status >/dev/null 2>&1; then
            break
          fi
          if [ "$attempt" -eq 60 ]; then
            minikube -p "{{.PROFILE}}" status || true
            echo 'Minikube profile "{{.PROFILE}}" did not become ready within 120 seconds.' >&2
            exit 1
          fi
          sleep 2
        done

        {{.KUBECTL}} wait --for=condition=Ready node --all --timeout=120s
        minikube -p "{{.PROFILE}}" status

  kubernetes:images:build:
    desc: Build all Taskmigo images directly in Minikube containerd
    internal: true
    deps:
      - kubernetes:cluster:ready
    cmds:
      - |
        runtime="$({{.KUBECTL}} get nodes -o jsonpath='{.items[0].status.nodeInfo.containerRuntimeVersion}')"
        case "$runtime" in
          containerd://*) ;;
          *)
            echo "Minikube profile '{{.PROFILE}}' must use containerd; found ${runtime:-unknown}." >&2
            exit 1
            ;;
        esac
      - minikube -p "{{.PROFILE}}" image build --build-opt=opt=target=bootstrap -t "taskmigo-bootstrap:{{.SERVER_VERSION}}" server
      - minikube -p "{{.PROFILE}}" image build --build-opt=opt=target=web -t "taskmigo-web:{{.SERVER_VERSION}}" server
      - minikube -p "{{.PROFILE}}" image build --build-opt=opt=target=worker -t "taskmigo-worker:{{.SERVER_VERSION}}" server
      - minikube -p "{{.PROFILE}}" image build -t "taskmigo-client:{{.CLIENT_VERSION}}" client

  kubernetes:prepare:
    internal: true
    deps:
      - kubernetes:validate
      - kubernetes:images:build
      - kubernetes:database:start
      - kubernetes:gateway-controller:start

  kubernetes:database:start:
    desc: Create local credentials and start PostgreSQL
    internal: true
    deps:
      - kubernetes:cluster:ready
    cmds:
      - |
        set -euo pipefail

        {{.KUBECTL}} create namespace "{{.NAMESPACE}}" \
          --dry-run=client -o yaml \
          | {{.KUBECTL}} apply -f -

        if ! {{.KUBECTL}} -n "{{.NAMESPACE}}" get secret taskmigo-secrets >/dev/null 2>&1; then
          if [ "${CI:-false}" = true ]; then
            command -v openssl >/dev/null || {
              echo "openssl is required to generate CI credentials." >&2
              exit 1
            }
            database_password="${DATABASE_PASSWORD:-$(openssl rand -hex 16)}"
            bootstrap_password="${BOOTSTRAP_USER_PASSWORD:-$(openssl rand -hex 16)}"
            auth_client_secret="${AUTH_CLIENT_SECRET:-$(openssl rand -hex 32)}"
            auth_session_secret="${AUTH_SESSION_SECRET:-$(openssl rand -hex 32)}"
            test_client_secret="${INTEGRATION_TEST_CLIENT_SECRET:-$(openssl rand -hex 32)}"
          else
            database_password="${DATABASE_PASSWORD:-taskmigo}"
            bootstrap_password="${BOOTSTRAP_USER_PASSWORD:-taskmigo}"
            auth_client_secret="${AUTH_CLIENT_SECRET:-taskmigo-local-browser-secret}"
            auth_session_secret="${AUTH_SESSION_SECRET:-taskmigo-local-session-secret-0123456789abcdef}"
            test_client_secret="${INTEGRATION_TEST_CLIENT_SECRET:-taskmigo-local-test-client-secret}"
          fi

          {{.KUBECTL}} -n "{{.NAMESPACE}}" create secret generic taskmigo-secrets \
            --from-literal=database-password="$database_password" \
            --from-literal=bootstrap-user-password="$bootstrap_password" \
            --from-literal=auth-client-secret="$auth_client_secret" \
            --from-literal=auth-session-secret="$auth_session_secret" \
            --from-literal=integration-test-client-secret="$test_client_secret"
        fi

        {{.KUBECTL}} -n "{{.NAMESPACE}}" apply -f deploy/minikube/postgresql.yaml

  kubernetes:database:ready:
    desc: Wait until PostgreSQL is ready for bootstrap
    internal: true
    cmds:
      - '{{.KUBECTL}} -n "{{.NAMESPACE}}" rollout status deployment/postgresql --timeout=120s'

  kubernetes:gateway-controller:start:
    desc: Start Envoy Gateway and create the local GatewayClass
    internal: true
    deps:
      - kubernetes:cluster:ready
    cmds:
      - |
        set -euo pipefail

        {{.HELM}} upgrade --install envoy-gateway oci://docker.io/envoyproxy/gateway-helm \
          --kube-context "{{.KUBE_CONTEXT}}" \
          --version {{.ENVOY_GATEWAY_VERSION}} \
          --namespace envoy-gateway-system \
          --create-namespace \
          --timeout 5m

        {{.KUBECTL}} apply -f - <<EOF
        apiVersion: gateway.networking.k8s.io/v1
        kind: GatewayClass
        metadata:
          name: {{.GATEWAY_NAME}}
        spec:
          controllerName: gateway.envoyproxy.io/gatewayclass-controller
        EOF

  kubernetes:gateway-controller:ready:
    desc: Wait until Envoy Gateway can reconcile routes
    internal: true
    cmds:
      - |
        set -euo pipefail
        {{.KUBECTL}} -n envoy-gateway-system wait \
          --for=condition=Available deployment/envoy-gateway \
          --timeout=180s
        {{.KUBECTL}} wait \
          --for=condition=Accepted gatewayclass/{{.GATEWAY_NAME}} \
          --timeout=180s

  kubernetes:release:
    desc: Install or upgrade the Taskmigo Helm release
    internal: true
    vars:
      MINIKUBE_IP:
        sh: minikube -p "{{.PROFILE}}" ip
    cmds:
      - |
        set -euo pipefail

        {{.HELM}} upgrade --install "{{.RELEASE}}" helm/taskmigo \
          --kube-context "{{.KUBE_CONTEXT}}" \
          --namespace "{{.NAMESPACE}}" \
          --timeout 10m \
          --set-string fullnameOverride={{.RELEASE}} \
          --set bootstrap.image.repository=taskmigo-bootstrap \
          --set bootstrap.image.tag={{.SERVER_VERSION}} \
          --set bootstrap.image.pullPolicy=Never \
          --set bootstrap.testClient.enabled=true \
          --set web.image.repository=taskmigo-web \
          --set web.image.tag={{.SERVER_VERSION}} \
          --set web.image.pullPolicy=Never \
          --set-string web.publicUrl="http://{{.PUBLIC_HOST}}" \
          --set worker.image.repository=taskmigo-worker \
          --set worker.image.tag={{.SERVER_VERSION}} \
          --set worker.image.pullPolicy=Never \
          --set client.image.repository=taskmigo-client \
          --set client.image.tag={{.CLIENT_VERSION}} \
          --set client.image.pullPolicy=Never \
          --set-string client.publicUrl="http://{{.PUBLIC_HOST}}" \
          --set-string client.auth.issuer="http://{{.PUBLIC_HOST}}" \
          --set-string 'client.hostAliases[0].ip={{.MINIKUBE_IP}}' \
          --set-string 'client.hostAliases[0].hostnames[0]={{.PUBLIC_HOST}}' \
          --set gateway.enabled=true \
          --set gateway.create=true \
          --set-string gateway.name={{.GATEWAY_NAME}} \
          --set-string gateway.className={{.GATEWAY_NAME}} \
          --set-string 'gateway.addresses[0].type=IPAddress' \
          --set-string 'gateway.addresses[0].value={{.MINIKUBE_IP}}' \
          --set-string gateway.clientHost={{.PUBLIC_HOST}} \
          --set-string gateway.webHost={{.PUBLIC_HOST}} \
          --set tests.enabled=true \
          --set tests.oauthClient.enabled=true

        {{.KUBECTL}} -n "{{.NAMESPACE}}" rollout restart deployment/{{.RELEASE}}-web
        {{.KUBECTL}} -n "{{.NAMESPACE}}" rollout restart deployment/{{.RELEASE}}-worker
        {{.KUBECTL}} -n "{{.NAMESPACE}}" rollout restart deployment/{{.RELEASE}}-client

  kubernetes:workloads:ready:
    desc: Wait until Taskmigo workloads are ready
    internal: true
    cmds:
      - |
        set -euo pipefail

        {{.KUBECTL}} -n "{{.NAMESPACE}}" wait \
          --for=condition=complete job/{{.RELEASE}}-bootstrap \
          --timeout=120s
        {{.KUBECTL}} -n "{{.NAMESPACE}}" rollout status \
          deployment/{{.RELEASE}}-web --timeout=180s
        {{.KUBECTL}} -n "{{.NAMESPACE}}" rollout status \
          deployment/{{.RELEASE}}-worker --timeout=180s
        {{.KUBECTL}} -n "{{.NAMESPACE}}" rollout status \
          deployment/{{.RELEASE}}-client --timeout=180s

  kubernetes:verify:
    desc: Verify workloads, routes, migrations, and public endpoints
    vars:
      MINIKUBE_IP:
        sh: minikube -p "{{.PROFILE}}" ip
    deps:
      - kubernetes:gateway-controller:ready
      - kubernetes:workloads:ready
    cmds:
      - |
        set -euo pipefail

        {{.KUBECTL}} -n "{{.NAMESPACE}}" wait \
          --for='jsonpath={.status.parents[0].conditions[?(@.type=="Accepted")].status}=True' \
          httproute/{{.RELEASE}}-client \
          --timeout=120s
        {{.KUBECTL}} -n "{{.NAMESPACE}}" wait \
          --for='jsonpath={.status.parents[0].conditions[?(@.type=="Accepted")].status}=True' \
          httproute/{{.RELEASE}}-web \
          --timeout=120s

        migration_versions="$({{.KUBECTL}} -n "{{.NAMESPACE}}" exec deployment/postgresql -- \
          psql -U taskmigo -d taskmigo -Atc \
          'SELECT version FROM flyway_schema_history WHERE success = true ORDER BY installed_rank')"
        test "$migration_versions" = "1"

        resolve="{{.PUBLIC_HOST}}:80:{{.MINIKUBE_IP}}"
        curl --noproxy '*' --resolve "$resolve" --fail --silent --show-error \
          --retry 30 --retry-all-errors --retry-delay 1 \
          "http://{{.PUBLIC_HOST}}/" >/dev/null
        curl --noproxy '*' --resolve "$resolve" --fail --silent --show-error \
          --retry 30 --retry-all-errors --retry-delay 1 \
          "http://{{.PUBLIC_HOST}}/.well-known/openid-configuration" >/dev/null
        api_status="$(curl --noproxy '*' --resolve "$resolve" --silent --show-error \
          --output /dev/null --write-out '%{http_code}' \
          "http://{{.PUBLIC_HOST}}/api/v0/permissions")"
        test "$api_status" = 401

  kubernetes:info:
    desc: Print local endpoints and bootstrap credentials
    vars:
      MINIKUBE_IP:
        sh: minikube -p "{{.PROFILE}}" ip
    cmds:
      - |
        if [ "${CI:-false}" = true ]; then
          printf 'Taskmigo is ready.\n\nURL:      http://{{.PUBLIC_HOST}}\nAPI:      http://{{.PUBLIC_HOST}}/api\nOIDC:     http://{{.PUBLIC_HOST}}/.well-known/openid-configuration\nAPI docs: http://{{.PUBLIC_HOST}}/api/docs\nHost entry: {{.MINIKUBE_IP}} {{.PUBLIC_HOST}}\nCredentials: stored in secret/taskmigo-secrets\n'
        else
          password="$({{.KUBECTL}} -n "{{.NAMESPACE}}" get secret taskmigo-secrets \
            -o go-template='{{`{{index .data "bootstrap-user-password" | base64decode}}`}}')"
          printf 'Taskmigo is ready.\n\nURL:      http://{{.PUBLIC_HOST}}\nAPI:      http://{{.PUBLIC_HOST}}/api\nOIDC:     http://{{.PUBLIC_HOST}}/.well-known/openid-configuration\nAPI docs: http://{{.PUBLIC_HOST}}/api/docs\nHost entry: {{.MINIKUBE_IP}} {{.PUBLIC_HOST}}\nUsername: system\nPassword: %s\n' "$password"
        fi

  kubernetes:deploy:
    desc: Build and deploy Taskmigo from end to end on Minikube
    aliases: [deploy]
    cmds:
      - task: kubernetes:prepare
      - task: kubernetes:database:ready
      - task: kubernetes:release
      - task: kubernetes:verify
      - task: kubernetes:info

  kubernetes:test:
    desc: Run Helm integration tests against the deployment
    cmds:
      - '{{.HELM}} test "{{.RELEASE}}" --kube-context "{{.KUBE_CONTEXT}}" --namespace "{{.NAMESPACE}}" --logs --timeout 5m'

  kubernetes:diagnostics:
    desc: Print bounded Kubernetes diagnostics for a failed deployment
    cmds:
      - |
        echo "::group::Kubernetes resources"
        {{.KUBECTL}} -n "{{.NAMESPACE}}" get all,pvc -o wide || true
        echo "::endgroup::"

        echo "::group::Gateway API resources"
        {{.KUBECTL}} get gatewayclasses,gateway,httproutes --all-namespaces -o wide || true
        {{.KUBECTL}} describe gatewayclass "{{.GATEWAY_NAME}}" || true
        {{.KUBECTL}} -n "{{.NAMESPACE}}" describe gateway "{{.GATEWAY_NAME}}" || true
        {{.KUBECTL}} -n "{{.NAMESPACE}}" describe httproute "{{.RELEASE}}-client" || true
        {{.KUBECTL}} -n "{{.NAMESPACE}}" describe httproute "{{.RELEASE}}-web" || true
        echo "::endgroup::"

        echo "::group::Envoy Gateway resources"
        {{.KUBECTL}} -n envoy-gateway-system get all -o wide || true
        {{.KUBECTL}} -n envoy-gateway-system logs deployment/envoy-gateway --tail=200 || true
        echo "::endgroup::"

        echo "::group::Helm release"
        {{.HELM}} status "{{.RELEASE}}" --kube-context "{{.KUBE_CONTEXT}}" --namespace "{{.NAMESPACE}}" || true
        echo "::endgroup::"

        for pod in $({{.KUBECTL}} -n "{{.NAMESPACE}}" get pods -o name 2>/dev/null); do
          echo "::group::Logs $pod"
          {{.KUBECTL}} -n "{{.NAMESPACE}}" logs "$pod" --all-containers --tail=200 || true
          echo "::endgroup::"
          echo "::group::Describe $pod"
          {{.KUBECTL}} -n "{{.NAMESPACE}}" describe "$pod" || true
          echo "::endgroup::"
        done

        for pod in $({{.KUBECTL}} -n envoy-gateway-system get pods -o name 2>/dev/null); do
          echo "::group::Envoy logs $pod"
          {{.KUBECTL}} -n envoy-gateway-system logs "$pod" --all-containers --tail=200 || true
          echo "::endgroup::"
        done

  kubernetes:reset:
    desc: Remove Taskmigo local resources without deleting the Minikube profile
    preconditions:
      - sh: command -v helm >/dev/null
        msg: Helm is required. Install it before running this task.
    cmds:
      - '{{.HELM}} uninstall "{{.RELEASE}}" --kube-context "{{.KUBE_CONTEXT}}" --namespace "{{.NAMESPACE}}" --ignore-not-found'
      - '{{.KUBECTL}} delete namespace "{{.NAMESPACE}}" --ignore-not-found'
      - '{{.KUBECTL}} delete gatewayclass "{{.GATEWAY_NAME}}" --ignore-not-found'
