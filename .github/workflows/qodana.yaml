---
name: Qodana

on:
  pull_request:
    paths:
      - server/**
      - "!server/**/*.md"
      - "!server/benchmarks/**"
      - .github/workflows/qodana.yaml
  push:
    branches: [next]
    paths:
      - server/**
      - "!server/**/*.md"
      - "!server/benchmarks/**"
      - .github/workflows/qodana.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  pull-requests: write
  checks: write
  security-events: write

env:
  SARIF_PATH: qodana/results/qodana.sarif.json

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "26"

      - name: Generate language parser sources
        working-directory: server
        run: ./gradlew :modules:language:generateGrammarSource --no-daemon --console=plain

      - name: Scan
        uses: JetBrains/qodana-action@v2026.2.2
        with:
          pr-mode: false
          use-caches: false
          use-annotations: false
          push-fixes: pull-request
          args: --project-dir server --apply-fixes

      - name: Check Qodana SARIF
        id: qodana-sarif
        if: ${{ always() }}
        shell: bash
        run: |
          SARIF_FILE="$RUNNER_TEMP/$SARIF_PATH"

          echo "file=$SARIF_FILE" >> "$GITHUB_OUTPUT"
          [[ -f "$SARIF_FILE" ]] && echo "exists=true" >> "$GITHUB_OUTPUT"

      - name: Prepare Qodana results
        id: qodana-results
        if: ${{ failure() && steps.qodana-sarif.outputs.exists == 'true' }}
        shell: bash
        env:
          SARIF_FILE: ${{ steps.qodana-sarif.outputs.file }}
        run: |
          RESULTS_FILE="$RUNNER_TEMP/qodana-results.json"
          jq '[.runs[]?.results[]?]' "$SARIF_FILE" > "$RESULTS_FILE"
          echo "file=$RESULTS_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload Qodana results artifact
        if: ${{ failure() && steps.qodana-results.outputs.file != '' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: qodana-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.qodana-results.outputs.file }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload SARIF
        if: ${{ always() && steps.qodana-sarif.outputs.exists == 'true' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.qodana-sarif.outputs.file }}
          wait-for-processing: true
