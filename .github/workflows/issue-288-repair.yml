name: Issue 288 repair

on:
  push:
    branches:
      - refactor/288-query-object-auth-feature-modules

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refactor/288-query-object-auth-feature-modules
          fetch-depth: 0

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle
          cache-dependency-path: |
            server/**/*.gradle*
            server/gradle/libs.versions.toml

      - name: Migrate feature-owned query authorization tests
        run: |
          python3 .github/issue-288-repair.py
          cd server
          ./gradlew --no-daemon --console=plain spotlessApply

      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test(server): migrate feature-owned query authorization coverage"
          git push origin HEAD:refactor/288-query-object-auth-feature-modules
