name: Client lockfile

on:
  pull_request:
    paths:
      - "client/package.json"
      - ".github/workflows/client-lockfile.yml"

permissions:
  contents: write

jobs:
  generate:
    name: Generate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: init-nextjs-client

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.7.0

      - name: Generate lockfile
        working-directory: client
        run: |
          rm pnpm-lock.yaml
          pnpm install --lockfile-only

      - name: Commit lockfile
        run: |
          rm .github/workflows/client-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/pnpm-lock.yaml .github/workflows/client-lockfile.yml
          git commit -m "Regenerate client pnpm lockfile"
          git push origin HEAD:init-nextjs-client
