name: Client lockfile

on:
  pull_request:
    paths:
      - "client/package.json"
      - ".github/workflows/client-lockfile.yml"

permissions:
  contents: read

jobs:
  generate:
    name: Generate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26

      - name: Generate lockfile
        working-directory: client
        run: |
          rm pnpm-lock.yaml
          pnpm install --lockfile-only

      - name: Upload lockfile
        uses: actions/upload-artifact@v4.6.2
        with:
          name: client-pnpm-lock
          path: client/pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
