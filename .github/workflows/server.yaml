---
name: Server

on:
  pull_request:
    paths:
      - server/**
      - "!server/**/*.md"
      - "!server/benchmarks/**"
      - .github/workflows/server.yaml
  push:
    branches: [next]
    paths:
      - server/**
      - "!server/**/*.md"
      - "!server/benchmarks/**"
      - .github/workflows/server.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "26"
          cache: gradle
          cache-dependency-path: |
            server/**/*.gradle*
            server/gradle/libs.versions.toml

      - name: Run Gradle build
        run: |
          set +e
          ./gradlew --no-daemon --console=plain --continue build \
            > "$RUNNER_TEMP/server-build.log" 2>&1
          exit_code=$?
          tail -n 300 "$RUNNER_TEMP/server-build.log" || true
          exit "$exit_code"

      - name: Upload Gradle build log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: server-build-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/server-build.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Verify OpenAPI snapshot
        run: |
          ./gradlew --no-daemon --console=plain :apps:web:generateOpenApi
          git diff --exit-code -- apps/web/src/main/resources/static/api/docs/openapi.yaml

      - name: Agent failure summary
        if: ${{ failure() }}
        run: |
          echo "::group::Server failures for AI agents"
          grep -E "(FAILED|error:|\[ERROR\]|Caused by:|Invalid explicit module dependency|There were failing tests|Checkstyle rule violations)" \
            "$RUNNER_TEMP/server-build.log" | tail -n 200 || true
          echo "::endgroup::"
          echo "::error::Server build failed. Prefer the server-build-log-${{ github.run_id }}-${{ github.run_attempt }} artifact and inspect server-build.log; use this grouped summary only as a quick hint."
