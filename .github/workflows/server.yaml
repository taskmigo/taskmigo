---
name: Server

on:
  pull_request:
    paths:
      - server/**
      - "!server/**/*.md"
      - "!server/benchmarks/**"
      - .github/workflows/server.yaml
  push:
    branches: [next]
    paths:
      - server/**
      - "!server/**/*.md"
      - "!server/benchmarks/**"
      - .github/workflows/server.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "26"
          cache: gradle
          cache-dependency-path: |
            server/**/*.gradle*
            server/gradle/libs.versions.toml

      - name: Run Gradle build
        run: |
          set +e
          ./gradlew --no-daemon --console=plain --continue build \
            > "$RUNNER_TEMP/server-build.log" 2>&1
          exit_code=$?
          tail -n 300 "$RUNNER_TEMP/server-build.log" || true
          exit "$exit_code"

      - name: Upload Gradle build log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: server-build-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/server-build.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Verify OpenAPI snapshot
        id: verify-openapi
        run: |
          ./gradlew --no-daemon --console=plain :apps:web:generateOpenApi
          if git diff --quiet -- apps/web/src/main/resources/static/api/docs/openapi.yaml; then
            echo "snapshot_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "snapshot_changed=true" >> "$GITHUB_OUTPUT"
          echo "::error::Generated OpenAPI snapshot differs from the checked-in snapshot."
          git diff --stat -- apps/web/src/main/resources/static/api/docs/openapi.yaml
          exit 1

      - name: Upload generated OpenAPI snapshot
        if: ${{ failure() && steps.verify-openapi.outputs.snapshot_changed == 'true' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: generated-openapi-${{ github.run_id }}-${{ github.run_attempt }}
          path: server/apps/web/src/main/resources/static/api/docs/openapi.yaml
          if-no-files-found: error
          retention-days: 1

      - name: Agent failure summary
        if: ${{ failure() }}
        run: |
          if [[ "${{ steps.verify-openapi.outputs.snapshot_changed }}" == "true" ]]; then
            echo "::error::OpenAPI snapshot is stale. Read .agents/skills/github-actions-openapi-snapshot-artifact/SKILL.md and use the generated-openapi-${{ github.run_id }}-${{ github.run_attempt }} artifact as the canonical replacement."
            exit 0
          fi

          echo "::group::Server failures for AI agents"
          grep -E "(FAILED|error:|\[ERROR\]|Caused by:|Invalid explicit module dependency|There were failing tests|Checkstyle rule violations)" \
            "$RUNNER_TEMP/server-build.log" | tail -n 200 || true
          echo "::endgroup::"
          echo "::error::Server build failed. Prefer the server-build-log-${{ github.run_id }}-${{ github.run_attempt }} artifact and inspect server-build.log; use this grouped summary only as a quick hint."
