name: Formatting

on:
  pull_request:
  push:
    branches: [next]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        id: formatting
        continue-on-error: true
        run: npm run format:check

      - name: Format files
        if: steps.formatting.outcome == 'failure'
        run: npm run format:fix

      - name: Collect formatted files
        if: success() && steps.formatting.outcome == 'failure'
        run: |
          artifact_dir="${RUNNER_TEMP}/prettier-formatted-files"
          mkdir -p "$artifact_dir"
          while IFS= read -r -d '' file; do
            destination="$artifact_dir/$file"
            mkdir -p "$(dirname "$destination")"
            cp "$file" "$destination"
          done < <(git diff --name-only --diff-filter=ACMRTUXB -z)

      - name: Upload formatted files
        if: success() && steps.formatting.outcome == 'failure'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: prettier-formatted-files
          path: ${{ runner.temp }}/prettier-formatted-files
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

      - name: Fail formatting check
        if: always() && steps.formatting.outcome == 'failure'
        run: |
          echo "::error::Formatting check failed. Use the prettier-formatted-files artifact from this run."
          exit 1
