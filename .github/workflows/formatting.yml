name: Formatting

on:
  pull_request:
  push:
    branches: [next]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: |
          if npm run format:check; then
            exit 0
          fi

          npm run format:fix
          echo "::group::Formatting diff"
          git --no-pager diff
          echo "::endgroup::"
          echo "::error::Formatting check failed. Apply the diff shown above."
          exit 1
