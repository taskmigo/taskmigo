name: Formatting

on:
  pull_request:
  push:
    branches: [next]

permissions:
  contents: read

jobs:
  verify:
    name: Verify Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Verify Formatting
        run: npm run format:check
