name: Formatting

on:
  pull_request:
  push:
    branches: [next]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: |
          npm run format:fix

          if git diff --quiet; then
            exit 0
          fi

          git diff --binary > "$RUNNER_TEMP/formatting.patch"
          git diff --name-only -z | tar --null --files-from=- -czf "$RUNNER_TEMP/formatted-files.tar.gz"

          echo "::group::Formatting patch for AI agents"
          git --no-pager diff --no-ext-diff --unified=3
          echo "::endgroup::"
          echo "::error::Formatting differs. Apply the patch shown above."
          exit 1

      - name: Apply formatting to this PR branch
        if: ${{ failure() && github.event_name == 'pull_request' && github.head_ref == 'feature/v1.0.0-alpha.3' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Apply repository formatting"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload formatting fix
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: formatting-fix
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/formatting.patch
            ${{ runner.temp }}/formatted-files.tar.gz
