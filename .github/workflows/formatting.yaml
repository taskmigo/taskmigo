---
name: Formatting

on:
  pull_request:
  push:
    branches: [next]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        id: formatting
        run: |
          set -euo pipefail

          npm run format:fix

          if git diff --quiet; then
            exit 0
          fi

          git --no-pager diff --no-ext-diff --binary --full-index > formatting.patch

          echo "::group::Formatting patch for AI agents"
          cat formatting.patch
          echo "::endgroup::"
          echo "::error::Formatting differs. Download the formatting-patch artifact and apply formatting.patch."
          exit 1

      - name: Upload formatting patch
        if: ${{ failure() && steps.formatting.outcome == 'failure' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: formatting-patch
          path: formatting.patch
          if-no-files-found: ignore
          retention-days: 1
