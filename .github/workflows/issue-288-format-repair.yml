name: Issue 288 format repair

on:
  push:
    branches:
      - refactor/288-query-object-auth-feature-modules

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refactor/288-query-object-auth-feature-modules
          fetch-depth: 0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Apply repository formatter
        run: |
          npm ci
          npm run format:fix

      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "style(server): apply repository formatting"
          git push origin HEAD:refactor/288-query-object-auth-feature-modules
