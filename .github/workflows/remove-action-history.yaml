---
name: Remove action history

on:
  schedule:
    - cron: 23 * * * *
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: remove-action-history
  cancel-in-progress: true

jobs:
  cleanup:
    name: Remove expired workflow runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RETENTION_DAYS: "7"
      MAX_DELETIONS_PER_RUN: "5"
      DELETE_DELAY_SECONDS: "5"
    steps:
      - name: Remove expired workflow runs
        shell: bash
        run: |
          set -euo pipefail

          cutoff_date="$(date -u -d "$RETENTION_DAYS days ago" +%Y-%m-%d)"
          response="$RUNNER_TEMP/workflow-runs.json"

          if ! gh api \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GH_REPO/actions/runs?status=completed&created=%3C${cutoff_date}&per_page=100" \
            > "$response"; then
            echo "::warning::GitHub API rate limit reached while listing workflow runs; cleanup will retry on the next schedule."
            exit 0
          fi

          mapfile -t candidates < <(
            jq -r '
              .workflow_runs[]
              | [.created_at, (.id | tostring), .path]
              | @tsv
            ' "$response" \
              | sort \
              | head -n "$MAX_DELETIONS_PER_RUN"
          )

          if (("${#candidates[@]}" == 0)); then
            echo "No expired workflow runs found in this batch."
            exit 0
          fi

          deleted=0
          for candidate in "${candidates[@]}"; do
            IFS=$'\t' read -r created_at run_id workflow_path <<< "$candidate"
            echo "Removing expired run $run_id from $workflow_path ($created_at)"

            if gh api --silent --method DELETE "repos/$GH_REPO/actions/runs/$run_id"; then
              deleted=$((deleted + 1))
            else
              echo "::warning::Could not remove run $run_id; cleanup will retry later."
              break
            fi

            sleep "$DELETE_DELAY_SECONDS"
          done

          echo "Removed $deleted expired workflow run(s)."
