name: Server

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  push:
    branches: [next]
    paths:
      - "server/**"
      - ".github/workflows/server.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "26"
          cache: gradle
          cache-dependency-path: |
            server/**/*.gradle*
            server/gradle/libs.versions.toml

      - name: Run Gradle build
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain --continue build 2>&1 | tee "$RUNNER_TEMP/server-build.log"

      - name: Agent failure summary
        if: ${{ failure() }}
        run: |
          echo "::group::Server failures for AI agents"
          grep -E "(FAILED|error:|\[ERROR\]|Caused by:|Invalid explicit module dependency|There were failing tests|Checkstyle rule violations)" \
            "$RUNNER_TEMP/server-build.log" | tail -n 200 || true
          echo "::endgroup::"
          echo "::error::Server build failed. Inspect the grouped summary and the Run Gradle build step above."
