name: End-to-end

on:
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/e2e.yml"
      - "gradle/**"
      - "gradlew"
      - "*.gradle.kts"
      - "taskmigo-*/build.gradle.kts"
      - "taskmigo-*/Dockerfile"
      - "taskmigo-*/src/**"
  push:
    branches: [next]
    paths:
      - ".dockerignore"
      - ".github/workflows/e2e.yml"
      - "gradle/**"
      - "gradlew"
      - "*.gradle.kts"
      - "taskmigo-*/build.gradle.kts"
      - "taskmigo-*/Dockerfile"
      - "taskmigo-*/src/**"

permissions:
  contents: read

jobs:
  e2e:
    name: Run end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.3.0
      - name: Build web image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: taskmigo-web/Dockerfile
          load: true
          tags: taskmigo-web:e2e
      - name: Build worker image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: taskmigo-worker/Dockerfile
          load: true
          tags: taskmigo-worker:e2e
      - name: Start PostgreSQL
        run: |
          docker network create taskmigo-e2e
          docker run --detach \
            --name taskmigo-postgres-e2e \
            --network taskmigo-e2e \
            --env POSTGRES_DB=taskmigo \
            --env POSTGRES_USER=taskmigo \
            --env POSTGRES_PASSWORD=taskmigo \
            postgres:18.4-alpine

          for attempt in {1..60}; do
            if docker exec taskmigo-postgres-e2e pg_isready --username taskmigo --dbname taskmigo; then
              exit 0
            fi
            sleep 1
          done

          docker logs taskmigo-postgres-e2e
          exit 1
      - name: Verify web image
        run: |
          docker run --detach \
            --name taskmigo-web-e2e \
            --network taskmigo-e2e \
            --publish 18080:8080 \
            --env TASKMIGO_DATABASE_URL=jdbc:postgresql://taskmigo-postgres-e2e:5432/taskmigo \
            --env TASKMIGO_DATABASE_USERNAME=taskmigo \
            --env TASKMIGO_DATABASE_PASSWORD=taskmigo \
            taskmigo-web:e2e

          token_response=""
          for attempt in {1..60}; do
            if token_response=$(curl --fail --silent --show-error \
              --user taskmigo-cli:taskmigo-dev-secret \
              --data grant_type=client_credentials \
              --data scope=taskmigo.api \
              http://localhost:18080/oauth2/token); then
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' taskmigo-web-e2e)" != "true" ]; then
              docker logs taskmigo-web-e2e
              exit 1
            fi
            sleep 1
          done

          token=$(jq --exit-status --raw-output '.access_token' <<<"$token_response")
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $token" \
            http://localhost:18080/api/v0/permissions \
            | jq --exit-status 'sort == ["project.members.manage", "project.members.read", "project.read", "project.update"]'

          test "$(docker inspect --format '{{.Config.User}}' taskmigo-web-e2e)" = "10001:10001"
      - name: Verify worker image
        run: |
          docker run --detach \
            --name taskmigo-worker-e2e \
            --network taskmigo-e2e \
            --env TASKMIGO_DATABASE_URL=jdbc:postgresql://taskmigo-postgres-e2e:5432/taskmigo \
            --env TASKMIGO_DATABASE_USERNAME=taskmigo \
            --env TASKMIGO_DATABASE_PASSWORD=taskmigo \
            taskmigo-worker:e2e

          for attempt in {1..60}; do
            if docker logs taskmigo-worker-e2e 2>&1 | grep --quiet "Started TaskmigoWorkerApplication"; then
              test "$(docker inspect --format '{{.State.Running}}' taskmigo-worker-e2e)" = "true"
              test "$(docker inspect --format '{{.Config.User}}' taskmigo-worker-e2e)" = "10001:10001"
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' taskmigo-worker-e2e)" != "true" ]; then
              docker logs taskmigo-worker-e2e
              exit 1
            fi
            sleep 1
          done

          docker logs taskmigo-worker-e2e
          exit 1
      - name: Clean up
        if: always()
        run: |
          docker rm --force taskmigo-web-e2e taskmigo-worker-e2e taskmigo-postgres-e2e || true
          docker network rm taskmigo-e2e || true
