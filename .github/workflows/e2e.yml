name: End-to-end

on:
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/e2e.yml"
      - "compose.yaml"
      - "gradle/**"
      - "gradlew"
      - "scripts/e2e.sh"
      - "*.gradle.kts"
      - "taskmigo-*/build.gradle.kts"
      - "taskmigo-*/Dockerfile"
      - "taskmigo-*/src/**"
  push:
    branches: [next]
    paths:
      - ".dockerignore"
      - ".github/workflows/e2e.yml"
      - "compose.yaml"
      - "gradle/**"
      - "gradlew"
      - "scripts/e2e.sh"
      - "*.gradle.kts"
      - "taskmigo-*/build.gradle.kts"
      - "taskmigo-*/Dockerfile"
      - "taskmigo-*/src/**"

permissions:
  contents: read

jobs:
  e2e:
    name: Run end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run end-to-end tests
        run: ./scripts/e2e.sh
