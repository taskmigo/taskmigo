name: Qodana

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/qodana.yml"
  push:
    branches: [next]
    paths:
      - "server/**"
      - ".github/workflows/qodana.yml"

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  analyze:
    name: Analyze Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "26"
          cache: gradle
          cache-dependency-path: |
            server/**/*.gradle*
            server/gradle/libs.versions.toml
      - name: Analyze code
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: >-
            --linter qodana-jvm-community
            --within-docker false
            --project-dir server
