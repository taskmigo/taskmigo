name: Qodana

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/qodana.yml"
  push:
    branches: [next]
    paths:
      - "server/**"
      - ".github/workflows/qodana.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  pull-requests: write
  checks: write
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "26"
          cache: gradle

      - name: Scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          pr-mode: false
          upload-result: false
          use-caches: true
          # Qodana's cached IntelliJ model contains paths into Gradle User Home.
          # Restore it only for the exact Gradle graph so that the model cannot
          # outlive the dependency artifacts it references. The v2 namespace
          # intentionally invalidates project-model caches created before this
          # cache-coherency rule.
          primary-cache-key: >-
            qodana-project-v2-2026.2-java26-${{ runner.os }}-${{ hashFiles('server/**/*.gradle*', 'server/gradle/libs.versions.toml') }}
          args: >-
            --linter qodana-jvm-community
            --within-docker false
            --project-dir server

      - name: Qodana failure summary
        if: ${{ failure() }}
        env:
          SARIF_FILE: ${{ runner.temp }}/qodana/results/qodana.sarif.json
          FINDING_LIMIT: "80"
          GROUP_LIMIT: "15"
        run: |
          if [[ ! -f "$SARIF_FILE" ]]; then
            echo "::error::Qodana failed before producing SARIF: $SARIF_FILE"
            exit 0
          fi

          echo "::group::Qodana failure summary for AI agents"
          if ! jq -r --argjson findingLimit "$FINDING_LIMIT" --argjson groupLimit "$GROUP_LIMIT" '
            [.runs[].results[]] as $results |
            ($results | length) as $total |
            "Total findings: \($total)",
            "Affected rules: \($results | map(.ruleId // "<unknown>") | unique | length)",
            "Affected files: \($results | map(.locations[0].physicalLocation.artifactLocation.uri // "<unknown>") | unique | length)",
            "",
            "Top rules:",
            (
              $results
              | sort_by(.ruleId // "<unknown>")
              | group_by(.ruleId // "<unknown>")
              | map({name: (.[0].ruleId // "<unknown>"), count: length})
              | sort_by([-.count, .name])
              | .[:$groupLimit][]
              | "  \(.count)\t\(.name)"
            ),
            "",
            "Top files:",
            (
              $results
              | sort_by(.locations[0].physicalLocation.artifactLocation.uri // "<unknown>")
              | group_by(.locations[0].physicalLocation.artifactLocation.uri // "<unknown>")
              | map({name: (.[0].locations[0].physicalLocation.artifactLocation.uri // "<unknown>"), count: length})
              | sort_by([-.count, .name])
              | .[:$groupLimit][]
              | "  \(.count)\t\(.name)"
            ),
            "",
            "Concrete findings (showing \([$total, $findingLimit] | min) of \($total)):",
            (
              $results[:$findingLimit][] |
              . as $result |
              ($result.locations[0].physicalLocation // {}) as $location |
              (($result.message.text // "") | gsub("[\\r\\n\\t]+"; " ") | .[:500]) as $message |
              "\($location.artifactLocation.uri // "<unknown>"):\($location.region.startLine // "?") [\($result.ruleId // "<unknown>")] \($message)"
            ),
            if $total > $findingLimit then
              "",
              "Output truncated: \($total - $findingLimit) additional findings are available in GitHub code scanning."
            else empty end
          ' "$SARIF_FILE"; then
            echo "::warning::Could not parse Qodana SARIF; inspect the Scan step above."
          fi
          echo "::endgroup::"

      - name: Upload SARIF
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
          wait-for-processing: false
