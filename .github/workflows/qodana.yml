name: Qodana

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/qodana.yml"
  push:
    branches: [next]
    paths:
      - "server/**"
      - ".github/workflows/qodana.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  pull-requests: write
  checks: write
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "26"
          cache: gradle

      - name: Scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          pr-mode: false
          upload-result: false
          use-caches: true
          # Save an exact cache for the current Gradle graph, but when the graph
          # changes restore the newest cache produced by the same Qodana/JDK/OS
          # combination. Qodana then resyncs the Gradle model instead of doing a
          # completely cold IDE import and downloading source artifacts again.
          primary-cache-key: >-
            qodana-2026.2-java26-${{ runner.os }}-${{ hashFiles('server/**/*.gradle*', 'server/gradle/libs.versions.toml') }}
          additional-cache-key: qodana-2026.2-java26-${{ runner.os }}-
          args: >-
            --linter qodana-jvm-community
            --within-docker false
            --project-dir server

      - name: Qodana failure summary
        if: ${{ failure() }}
        env:
          SARIF_FILE: ${{ runner.temp }}/qodana/results/qodana.sarif.json
        run: |
          if [[ ! -f "$SARIF_FILE" ]]; then
            echo "::error::Qodana failed before producing SARIF: $SARIF_FILE"
            exit 0
          fi

          jq -r '
            [.runs[].results[]] as $results |
            "Qodana findings: \($results | length)",
            "Affected rules: \($results | map(.ruleId // "<unknown>") | unique | length)",
            "Affected files: \($results | map(.locations[0].physicalLocation.artifactLocation.uri // "<unknown>") | unique | length)",
            "Full details: download the qodana-sarif workflow artifact."
          ' "$SARIF_FILE" || echo "::warning::Could not parse Qodana SARIF. Download the qodana-sarif artifact for details."

      - name: Upload SARIF artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qodana-sarif
          path: ${{ runner.temp }}/qodana/results/qodana.sarif.json
          if-no-files-found: ignore
          compression-level: 6
          retention-days: 7

      - name: Upload SARIF
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
          wait-for-processing: false
