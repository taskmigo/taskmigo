---
name: Qodana

on:
  pull_request:
    paths:
      - server/**
      - "!server/**/*.md"
      - "!server/benchmarks/**"
      - .github/workflows/qodana.yml
  push:
    branches: [next]
    paths:
      - server/**
      - "!server/**/*.md"
      - "!server/benchmarks/**"
      - .github/workflows/qodana.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  pull-requests: write
  checks: write
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "26"

      - name: Generate language parser sources
        working-directory: server
        run: ./gradlew :modules:language:generateGrammarSource --no-daemon --console=plain

      - name: Scan
        uses: JetBrains/qodana-action@v2026.2.1
        with:
          pr-mode: false
          use-caches: false
          upload-result: false
          args: >-
            --project-dir server

      - name: Publish Qodana results to job summary
        if: ${{ always() }}
        shell: bash
        env:
          SARIF_FILE: ${{ runner.temp }}/qodana/results/qodana.sarif.json
        run: |
          {
            echo "## Qodana results"
            echo
            if [[ -f "$SARIF_FILE" ]]; then
              echo '```json'
              jq '{results: [.runs[]?.results[]?]}' "$SARIF_FILE"
              echo '```'
            else
              echo "Qodana did not produce a SARIF report."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SARIF
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
          wait-for-processing: true
