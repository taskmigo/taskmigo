name: Qodana

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/qodana.yml"
  push:
    branches: [next]
    paths:
      - "server/**"
      - ".github/workflows/qodana.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  pull-requests: write
  checks: write
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Keep full history for Qodana. Do not reduce this to a shallow checkout:
          # Qodana/PR analysis relies on accurate Git history and merge-base data.
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "26"
          cache: gradle

      - name: Scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          pr-mode: false
          upload-result: false
          use-caches: true
          # Keep only the action-managed project cache persistent. Native mode
          # derives its mutable IDE/linter system directory two levels above
          # cache-dir; that parent must remain runner-ephemeral and must never be
          # persisted with actions/cache, otherwise stale indexes can survive a
          # Gradle project-graph change and produce false classpath findings.
          cache-dir: ${{ runner.temp }}/qodana-system/state/cache
          # Tie reusable project state to every input that can change Gradle's
          # imported model. Each analyzed commit gets its own primary entry;
          # fallback reuse is allowed only inside the same compatibility graph.
          # v4 also makes every cache saved before the system/project isolation
          # unreachable after this fix.
          primary-cache-key: >-
            qodana-project-v4-2026.2-java26-${{ runner.os }}-${{ hashFiles('server/**/*.gradle*', 'server/gradle/libs.versions.toml', 'server/gradle/wrapper/gradle-wrapper.properties', 'server/gradle.properties') }}-${{ github.event.pull_request.head.sha || github.sha }}
          additional-cache-key: >-
            qodana-project-v4-2026.2-java26-${{ runner.os }}-${{ hashFiles('server/**/*.gradle*', 'server/gradle/libs.versions.toml', 'server/gradle/wrapper/gradle-wrapper.properties', 'server/gradle.properties') }}-
          args: >-
            --linter qodana-jvm-community
            --within-docker false
            --project-dir server

      - name: Check SARIF
        if: ${{ always() }}
        id: sarif
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/qodana/results/qodana.sarif.json" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Qodana SARIF was not generated; skipping SARIF uploads."
          fi

      - name: Upload SARIF for AI agents
        if: ${{ failure() && steps.sarif.outputs.exists == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: qodana-sarif
          path: ${{ runner.temp }}/qodana/results/qodana.sarif.json
          compression-level: 9
          retention-days: 1

      - name: Upload SARIF
        if: ${{ always() && steps.sarif.outputs.exists == 'true' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
          wait-for-processing: false
