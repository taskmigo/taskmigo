name: Qodana

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/qodana.yml"
  push:
    branches: [next]
    paths:
      - "server/**"
      - ".github/workflows/qodana.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "26"
          cache: gradle
          cache-dependency-path: |
            server/**/*.gradle*
            server/gradle/libs.versions.toml

      - name: Scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          pr-mode: false
          args: >-
            --linter qodana-jvm-community
            --within-docker false
            --project-dir server
