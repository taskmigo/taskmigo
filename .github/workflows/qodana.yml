name: Qodana

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/qodana.yml"
  push:
    branches: [next]
    paths:
      - "server/**"
      - ".github/workflows/qodana.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  pull-requests: write
  checks: write
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "26"
          cache: gradle
          cache-dependency-path: |
            server/**/*.gradle*
            server/gradle/libs.versions.toml

      - name: Resolve project dependencies
        working-directory: server
        run: >-
          ./gradlew --no-daemon --console=plain
          :taskmigo-core:classes
          :taskmigo-web:classes
          :taskmigo-web:testClasses
          :taskmigo-worker:classes
          :taskmigo-worker:testClasses

      - name: Scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          pr-mode: false
          upload-result: false
          use-caches: true
          primary-cache-key: >-
            qodana-2026.2-java26-${{ runner.os }}-${{ hashFiles('server/**/*.gradle*', 'server/gradle/libs.versions.toml') }}
          additional-cache-key: >-
            qodana-2026.2-java26-${{ runner.os }}-${{ hashFiles('server/**/*.gradle*', 'server/gradle/libs.versions.toml') }}
          args: >-
            --linter qodana-jvm-community
            --within-docker false
            --project-dir server

      - name: Agent failure summary
        if: ${{ failure() }}
        env:
          SARIF_FILE: ${{ runner.temp }}/qodana/results/qodana.sarif.json
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["SARIF_FILE"])
          print("::group::Qodana findings for AI agents")
          if not path.is_file():
              print(f"SARIF not found: {path}")
          else:
              sarif = json.loads(path.read_text())
              findings = []
              for run in sarif.get("runs", []):
                  for result in run.get("results", []):
                      location = (result.get("locations") or [{}])[0].get("physicalLocation", {})
                      artifact = location.get("artifactLocation", {}).get("uri", "<unknown>")
                      line = location.get("region", {}).get("startLine", "?")
                      rule = result.get("ruleId", "<unknown>")
                      message = result.get("message", {}).get("text", "").replace("\n", " ")
                      findings.append(f"{artifact}:{line} [{rule}] {message}")
              for finding in findings[:200]:
                  print(finding)
              print(f"Total findings: {len(findings)}")
          print("::endgroup::")
          PY

      - name: Upload SARIF
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
          wait-for-processing: false
