name: Qodana

on:
  pull_request:
    paths:
      - "server/**"
      - "!server/**/*.md"
      - ".github/workflows/qodana.yml"
  push:
    branches: [next]
    paths:
      - "server/**"
      - "!server/**/*.md"
      - ".github/workflows/qodana.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  pull-requests: write
  checks: write
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "26"
          cache: gradle

      - name: Scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          pr-mode: false
          use-caches: true
          upload-result: true
          args: >-
            --config qodana.yaml
            --print-problems
            --disable-update-checks

      - name: Check SARIF
        if: ${{ always() }}
        id: sarif
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/qodana/results/qodana.sarif.json" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Qodana SARIF was not generated; skipping SARIF uploads."
          fi

      - name: Upload SARIF
        if: ${{ always() && steps.sarif.outputs.exists == 'true' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
          wait-for-processing: false
