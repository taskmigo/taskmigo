name: Qodana

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/qodana.yml"
  push:
    branches: [next]
    paths:
      - "server/**"
      - ".github/workflows/qodana.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  pull-requests: write
  checks: write
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "26"
          cache: gradle

      - name: Scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          pr-mode: false
          upload-result: false
          use-caches: true
          # Qodana's cached IntelliJ model contains paths into Gradle User Home.
          # Restore it only for the exact Gradle graph so that the model cannot
          # outlive the dependency artifacts it references. The v2 namespace
          # intentionally invalidates project-model caches created before this
          # cache-coherency rule.
          primary-cache-key: >-
            qodana-project-v2-2026.2-java26-${{ runner.os }}-${{ hashFiles('server/**/*.gradle*', 'server/gradle/libs.versions.toml') }}
          args: >-
            --linter qodana-jvm-community
            --within-docker false
            --project-dir server

      - name: Upload SARIF for AI agents
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: qodana-sarif
          path: ${{ runner.temp }}/qodana/results/qodana.sarif.json
          if-no-files-found: warn
          compression-level: 9
          retention-days: 1

      - name: Upload SARIF
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
          wait-for-processing: false
