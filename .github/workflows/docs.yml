name: Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [next]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Restore Next.js Build Cache
        uses: actions/cache@v6.1.0
        with:
          path: docs/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('docs/package-lock.json') }}-${{ hashFiles('docs/**/*.js', 'docs/**/*.jsx', 'docs/**/*.ts', 'docs/**/*.tsx', 'docs/**/*.md', 'docs/**/*.mdx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('docs/package-lock.json') }}-

      - name: Setup Pages
        id: pages
        if: ${{ github.ref == 'refs/heads/next' && github.event_name != 'pull_request' }}
        uses: actions/configure-pages@v6.0.0

      - name: Install Dependencies
        run: npm ci

      - name: Verify Lint
        run: npm run lint:check

      - name: Verify Formatting
        run: npm run format:check

      - name: Verify Types
        run: npm run types:check

      - name: Build Documentation
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Upload Pages Artifact
        if: ${{ github.ref == 'refs/heads/next' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/out

  deploy:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ github.ref == 'refs/heads/next' && github.event_name != 'pull_request' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
