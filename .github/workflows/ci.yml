name: Server

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [next]
    paths:
      - "server/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Verify Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "26"
          cache: gradle
      - name: Verify build
        run: ./gradlew --no-daemon build
