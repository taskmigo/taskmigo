name: CI

on:
  pull_request:
  push:
    branches: [next]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Verify
        run: mvn --batch-mode --no-transfer-progress verify
