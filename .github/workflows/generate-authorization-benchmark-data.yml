name: Generate authorization benchmark data

on:
  push:
    branches: [feat/benchmark]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7.0.1
        with:
          ref: feat/benchmark

      - name: Write fixed datasets
        shell: bash
        run: |
          set -euo pipefail
          dir="server/benchmarks/authorization/src/jmh/resources/io/taskmigo/benchmarks/authorization"
          mkdir -p "$dir"

          printf '%s' '' | base64 -d | gzip -d > "$dir/simple-statements.tsv"

          printf '%s' '' | base64 -d | gzip -d > "$dir/complex-statements.tsv"

          git add "$dir/simple-statements.tsv" "$dir/complex-statements.tsv"
          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Add fixed authorization benchmark datasets"
          git push origin HEAD:feat/benchmark
