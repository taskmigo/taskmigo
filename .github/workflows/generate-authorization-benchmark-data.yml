name: Generate authorization benchmark data

on:
  push:
    branches: [feat/benchmark]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7.0.1
        with:
          ref: feat/benchmark

      - name: Write fixed datasets
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          SIZE = 500
          root = Path("server/benchmarks/authorization/src/jmh/resources/io/taskmigo/benchmarks/authorization")
          root.mkdir(parents=True, exist_ok=True)

          def simple_request(i):
              f = i % 25
              return [
                  f"export default ({{ request }}) => request.method === 'GET_{i:03d}';",
                  f"export default ({{ request }}) => request.method !== 'DELETE_{i:03d}';",
                  f"export default ({{ request }}) => request.pathVariables.userId === 'USER_{i:03d}';",
                  f"export default ({{ principal }}) => principal.id === 'PRINCIPAL_{i:03d}';",
                  f"export default ({{ principal }}) => principal.id !== 'BLOCKED_{i:03d}';",
                  f"export default ({{ request, principal }}) => request.method === 'PATCH_{i:03d}' && principal.id !== '';",
                  f"export default ({{ request, principal }}) => request.method !== 'TRACE_{i:03d}' || principal.id === 'P_{i:03d}';",
                  f"export default ({{ principal }}) => !(principal.disabled === true) && principal.rank >= {i};",
                  f"export default ({{ request, principal }}) => request.pathVariables.tenantId === principal.tenantId && request.pathVariables.region !== 'R_{i:03d}';",
                  f"export default ({{ principal }}) => principal.rank >= {i % 101};",
                  f"export default ({{ principal }}) => principal.rank < {(i % 101) + 50};",
                  f"export default ({{ request }}) => request.pathVariables.projectId !== request.pathVariables.userId && request.pathVariables.revision === 'REV_{i:03d}';",
                  f"export default ({{ request, principal }}) => request.method === 'POST_{i:03d}' && request.pathVariables.resourceId !== principal.id;",
                  f"export default ({{ request }}) => request.method === 'GET_{i:03d}' || request.method === 'HEAD_{i:03d}';",
                  f"export default ({{ principal }}) => principal.level >= {i} && principal.level <= {i + 5};",
                  f"export default ({{ request, principal }}) => request.pathVariables.region === 'REGION_{i % 23}' && principal.region === 'REGION_{i % 23}';",
                  f"export default ({{ request, principal }}) => request.pathVariables.ownerId === principal.id && request.pathVariables.resourceId !== 'R_{i:03d}';",
                  f"export default ({{ request, principal }}) => request.pathVariables.ownerId !== principal.id || request.pathVariables.publicId === 'PUB_{i:03d}';",
                  f"export default ({{ principal }}) => +principal.rank >= {i % 89};",
                  f"export default ({{ principal }}) => principal.score + {i % 7} >= {(i % 97) + 10};",
                  f"export default ({{ principal }}) => principal.score * {(i % 5) + 1} > {(i % 113) + 20};",
                  f"export default ({{ principal }}) => principal.score % {(i % 9) + 2} === {i};",
                  f"export default ({{ request, principal }}) => request.pathVariables.version === 'V_{i:03d}' && principal.active === true;",
                  f"export default ({{ request, principal }}) => request.method === 'PUT_{i:03d}' && !(principal.suspended === true);",
                  f"export default ({{ request, principal }}) => request.pathVariables.teamId === principal.teamId || request.pathVariables.teamId === 'TEAM_{i:03d}';",
              ][f]

          def simple_object(i):
              f = i % 25
              return [
                  f"export default ({{ object }}) => object.ownerId === 'OWNER_{i:03d}';",
                  f"export default ({{ object }}) => object.ownerId !== 'OWNER_{i:03d}';",
                  f"export default ({{ object }}) => object.status === 'STATUS_{i:03d}';",
                  f"export default ({{ object }}) => object.enabled === true && object.state !== 'STATE_{i:03d}';",
                  f"export default ({{ object }}) => object.enabled !== false || object.visibility === 'PUBLIC_{i:03d}';",
                  f"export default ({{ object }}) => object.score >= {i};",
                  f"export default ({{ object }}) => object.score < {i + 100};",
                  f"export default ({{ object }}) => object.version === {i};",
                  f"export default ({{ object }}) => object.kind !== 'KIND_{i:03d}';",
                  f"export default ({{ object, principal }}) => object.ownerId === principal.id && object.kind !== 'KIND_{i:03d}';",
                  f"export default ({{ object, principal }}) => object.status === 'S_{i:03d}' && object.ownerId === principal.id;",
                  f"export default ({{ object }}) => object.score >= {i} && object.enabled === true;",
                  f"export default ({{ object, principal }}) => object.status === 'S_{i:03d}' || object.ownerId === principal.id;",
                  f"export default ({{ object }}) => !(object.enabled === false) && object.kind !== 'ARCHIVED_{i:03d}';",
                  f"export default ({{ object, principal }}) => object.score >= {i} && principal.rank >= {i % 19};",
                  f"export default ({{ object, principal }}) => object.ownerId === principal.id && principal.active === true && object.state !== 'STATE_{i:03d}';",
                  f"export default ({{ object }}) => object.score >= {i} && object.score < {i + 100};",
                  f"export default ({{ object }}) => object.kind === 'K_{i:03d}' || object.kind === 'ALT_{i:03d}';",
                  f"export default ({{ object }}) => object.version >= {i} && object.status !== 'REMOVED_{i:03d}';",
                  f"export default ({{ object, principal }}) => object.ownerId === principal.id || (principal.admin === true && object.visibility === 'V_{i:03d}');",
                  f"export default ({{ object }}) => object.priority <= {i + 10} && object.enabled === true;",
                  f"export default ({{ object }}) => object.category === 'CATEGORY_{i % 31}' && object.deleted !== true;",
                  f"export default ({{ object, principal }}) => object.tenantId === principal.tenantId && object.visibility !== 'PRIVATE_{i:03d}';",
                  f"export default ({{ object }}) => object.createdEpoch > {i * 10} || object.pinned === true;",
                  f"export default ({{ object, principal }}) => object.assigneeId === principal.id && object.state !== 'CLOSED_{i:03d}';",
              ][f]

          REQUEST_CONDITIONS = [
              "request.method === expected",
              "request.pathVariables.userId === principal.id",
              "request.pathVariables.resourceId !== expected",
              "principal.id !== ''",
              "principal.role === expected",
              "principal.rank >= threshold",
              "request.version >= threshold",
              "request.sequence < upper",
              "!(request.method === expected)",
              "request.pathVariables.ownerId === principal.id",
              "request.pathVariables.projectId !== expected",
              "request.pathVariables.taskId === expected",
              "request.pathVariables.workspaceId === principal.tenantId",
              "request.pathVariables.tenantId === principal.tenantId",
              "request.pathVariables.scope !== alternate",
              "request.pathVariables.region === expected",
              "request.pathVariables.kind !== expected",
              "(principal.rank + offset) >= threshold",
              "(principal.score * factor) > threshold",
              "(request.sequence % divisor) === remainder",
          ]
          REQUEST_RETURNS = [
              "request.pathVariables.userId === principal.id",
              "request.method !== alternate",
              "principal.id === alternate",
              "principal.role !== expected",
              "principal.rank >= threshold",
              "principal.level < upper",
              "request.version >= threshold",
              "request.sequence <= upper",
              "request.pathVariables.resourceId === expected",
              "request.pathVariables.ownerId !== alternate",
              "request.pathVariables.projectId === expected && principal.id !== ''",
              "request.pathVariables.taskId !== alternate || principal.role === expected",
              "request.pathVariables.workspaceId === principal.tenantId",
              "request.pathVariables.tenantId !== alternate",
              "request.pathVariables.scope === expected",
              "request.pathVariables.region !== alternate",
              "request.pathVariables.kind === expected",
              "!(principal.id === alternate)",
              "(principal.rank * factor) >= threshold",
              "(request.sequence + offset) < upper",
          ]
          OBJECT_CONDITIONS = [
              "object.enabled === true",
              "object.ownerId === principal.id",
              "object.status === expected",
              "object.score >= threshold",
              "object.kind !== alternate",
              "object.version < upper",
              "object.priority >= threshold",
              "object.tenantId === principal.tenantId",
              "object.visibility !== alternate",
              "object.rank >= principal.rank",
              "!(object.enabled === false)",
              "object.ownerId !== alternate",
              "object.status !== alternate",
              "object.score > principal.rank",
              "object.version >= principal.version",
              "object.kind === principal.kind",
              "object.requiredLevel <= principal.level",
              "object.region === principal.region",
              "object.deleted !== true",
              "object.public === true",
          ]
          OBJECT_RETURNS = [
              "object.ownerId === principal.id",
              "object.enabled !== false",
              "object.status === expected",
              "object.score >= threshold",
              "object.kind !== alternate",
              "object.version < upper",
              "object.priority >= threshold",
              "object.tenantId === principal.tenantId",
              "object.visibility !== alternate",
              "object.rank >= principal.rank",
              "object.ownerId !== alternate",
              "object.status !== alternate",
              "object.score > principal.rank",
              "object.version >= principal.version",
              "object.kind === principal.kind",
              "object.requiredLevel <= principal.level",
              "object.region === principal.region",
              "object.deleted !== true",
              "object.public === true",
              "principal.active === true",
          ]

          def complex_policy(scope, i):
              family = i % 40
              shape = family % 5
              variant = family // 5
              if scope == "request":
                  args = "{ request, principal }"
                  conditions = REQUEST_CONDITIONS
                  returns = REQUEST_RETURNS
              else:
                  args = "{ object, principal }"
                  conditions = OBJECT_CONDITIONS
                  returns = OBJECT_RETURNS
              c1 = conditions[(variant * 2 + shape) % len(conditions)]
              c2 = conditions[(variant * 5 + shape + 3) % len(conditions)]
              c3 = conditions[(variant * 7 + shape + 6) % len(conditions)]
              r1 = returns[(variant * 3 + shape) % len(returns)]
              r2 = returns[(variant * 7 + shape + 4) % len(returns)]
              r3 = returns[(variant * 11 + shape + 8) % len(returns)]
              prefix = (
                  f"export default ({args}) => {{ "
                  f"const expected = 'E_{i:03d}'; const alternate = 'A_{i:03d}'; "
                  f"const threshold = {(i % 97) + 3}; const upper = {(i % 97) + 103}; "
                  f"const divisor = {(i % 7) + 2}; const remainder = {i % 2}; "
                  f"const factor = {(i % 5) + 2}; const offset = {(i % 11) + 1}; "
              )
              if shape == 0:
                  body = f"if ({c1}) {{ return {r1}; }} return false; }};"
              elif shape == 1:
                  body = f"if ({c1}) {{ if ({c2}) {{ return {r1}; }} return {r2}; }} return false; }};"
              elif shape == 2:
                  body = f"if ({c1}) {{ return {r1}; }} else {{ return {r2}; }} }};"
              elif shape == 3:
                  body = f"if ({c1} && {c2}) {{ return {r1}; }} if ({c3}) {{ return {r2}; }} return {r3}; }};"
              else:
                  body = f"if ({c1} || {c2}) {{ return ({r1}) && ({r2}); }} return {r3}; }};"
              return prefix + body

          def write_dataset(name, request_factory, object_factory):
              rows = [(f"{i:03d}", request_factory(i), object_factory(i)) for i in range(SIZE)]
              assert len(rows) == SIZE
              assert len({row[0] for row in rows}) == SIZE
              assert len({row[1] for row in rows}) == SIZE
              assert len({row[2] for row in rows}) == SIZE
              target = root / name
              with target.open("w", encoding="utf-8", newline="\n") as stream:
                  stream.write("id\trequest\tobject\n")
                  for row in rows:
                      stream.write("\t".join(row) + "\n")

          write_dataset("simple-statements.tsv", simple_request, simple_object)
          write_dataset(
              "complex-statements.tsv",
              lambda i: complex_policy("request", i),
              lambda i: complex_policy("object", i),
          )
          PY

          dir="server/benchmarks/authorization/src/jmh/resources/io/taskmigo/benchmarks/authorization"
          git add "$dir/simple-statements.tsv" "$dir/complex-statements.tsv"
          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Add fixed authorization benchmark datasets"
          git push origin HEAD:feat/benchmark
