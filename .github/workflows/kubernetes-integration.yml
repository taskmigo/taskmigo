name: Kubernetes Integration

on:
  pull_request:
    paths:
      - "helm/**"
      - "server/**"
      - "client/**"
      - "e2e/**"
      - ".github/workflows/kubernetes-integration.yml"
  push:
    branches: [next]
    paths:
      - "helm/**"
      - "server/**"
      - "client/**"
      - "e2e/**"
      - ".github/workflows/kubernetes-integration.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NAMESPACE: taskmigo-integration

jobs:
  integration:
    name: Deploy and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v4.2.4

      - name: Validate chart
        run: |
          helm lint helm/taskmigo
          helm template taskmigo helm/taskmigo \
            --set tests.enabled=true \
            --set tests.oauthClient.enabled=true \
            --set bootstrap.testClient.enabled=true \
            >/dev/null
          helm template taskmigo helm/taskmigo \
            --set gateway.enabled=true \
            --set gateway.create=true \
            --set gateway.className=test-gateway-class \
            >/dev/null
          helm template taskmigo helm/taskmigo \
            --set gateway.enabled=true \
            --set gateway.create=false \
            --set gateway.name=shared-gateway \
            --set gateway.namespace=gateway-system \
            >/dev/null

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "26.7.0"

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npm run typecheck
          npx playwright install --with-deps chromium

      - name: Set up Minikube CLI
        uses: medyagh/setup-minikube@v0.0.21
        with:
          start: false
          minikube-version: 1.38.1

      - name: Build Taskmigo images while Minikube starts
        run: |
          set -euo pipefail

          minikube_log="$RUNNER_TEMP/minikube-start.log"
          minikube start \
            --driver=docker \
            --container-runtime=docker \
            --kubernetes-version=v1.35.0 \
            --cpus=4 \
            --memory=6000m \
            --wait=all \
            >"$minikube_log" 2>&1 &
          minikube_pid=$!

          cleanup() {
            if kill -0 "$minikube_pid" 2>/dev/null; then
              kill "$minikube_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          # Build against the runner's Docker daemon while Minikube bootstraps.
          # The images are loaded into Minikube only after the cluster is ready.
          docker build -t taskmigo-bootstrap:integration -f server/apps/bootstrap/Dockerfile server
          docker build -t taskmigo-web:integration -f server/apps/web/Dockerfile server
          docker build -t taskmigo-worker:integration -f server/apps/worker/Dockerfile server
          docker build -t taskmigo-client:integration -f client/Dockerfile client

          if ! wait "$minikube_pid"; then
            cat "$minikube_log"
            exit 1
          fi
          trap - EXIT

          cat "$minikube_log"
          for image in \
            taskmigo-bootstrap:integration \
            taskmigo-web:integration \
            taskmigo-worker:integration \
            taskmigo-client:integration; do
            minikube image load --daemon "$image"
          done

      - name: Create integration database
        run: |
          kubectl create namespace "$NAMESPACE"

          kubectl -n "$NAMESPACE" create secret generic taskmigo-secrets \
            --from-literal=database-password="$(openssl rand -hex 16)" \
            --from-literal=bootstrap-user-password="$(openssl rand -hex 16)" \
            --from-literal=auth-client-secret="$(openssl rand -hex 32)" \
            --from-literal=auth-session-secret="$(openssl rand -hex 32)" \
            --from-literal=integration-test-client-secret="$(openssl rand -hex 32)"

          kubectl -n "$NAMESPACE" apply -f - <<'EOF'
          apiVersion: v1
          kind: Service
          metadata:
            name: postgresql
          spec:
            selector:
              app: postgresql
            ports:
              - name: postgresql
                port: 5432
                targetPort: postgresql
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: postgresql
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: postgresql
            template:
              metadata:
                labels:
                  app: postgresql
              spec:
                containers:
                  - name: postgresql
                    image: postgres:18.4-alpine
                    ports:
                      - name: postgresql
                        containerPort: 5432
                    env:
                      - name: POSTGRES_DB
                        value: taskmigo
                      - name: POSTGRES_USER
                        value: taskmigo
                      - name: POSTGRES_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: taskmigo-secrets
                            key: database-password
                    readinessProbe:
                      exec:
                        command:
                          - pg_isready
                          - -U
                          - taskmigo
                          - -d
                          - taskmigo
                      initialDelaySeconds: 2
                      periodSeconds: 2
          EOF

          kubectl -n "$NAMESPACE" rollout status deployment/postgresql --timeout=120s

      - name: Deploy Helm release
        run: |
          helm upgrade --install taskmigo helm/taskmigo \
            --namespace "$NAMESPACE" \
            --wait \
            --timeout 10m \
            --set bootstrap.image.repository=taskmigo-bootstrap \
            --set bootstrap.image.tag=integration \
            --set bootstrap.image.pullPolicy=Never \
            --set bootstrap.testClient.enabled=true \
            --set web.image.repository=taskmigo-web \
            --set web.image.tag=integration \
            --set web.image.pullPolicy=Never \
            --set worker.image.repository=taskmigo-worker \
            --set worker.image.tag=integration \
            --set worker.image.pullPolicy=Never \
            --set client.image.repository=taskmigo-client \
            --set client.image.tag=integration \
            --set client.image.pullPolicy=Never \
            --set tests.enabled=true \
            --set tests.oauthClient.enabled=true

      - name: Verify Kubernetes workloads
        run: |
          kubectl -n "$NAMESPACE" wait --for=condition=complete job/taskmigo-bootstrap --timeout=120s
          kubectl -n "$NAMESPACE" rollout status deployment/taskmigo-web --timeout=180s
          kubectl -n "$NAMESPACE" rollout status deployment/taskmigo-worker --timeout=180s
          kubectl -n "$NAMESPACE" rollout status deployment/taskmigo-client --timeout=180s

          migration_versions="$(kubectl -n "$NAMESPACE" exec deployment/postgresql -- \
            psql -U taskmigo -d taskmigo -Atc \
            'SELECT version FROM flyway_schema_history WHERE success = true ORDER BY installed_rank')"
          test "$migration_versions" = "1"

      - name: Run Helm integration test
        run: helm test taskmigo --namespace "$NAMESPACE" --logs --timeout 5m

      - name: Run Playwright Kubernetes E2E
        env:
          E2E_BASE_URL: http://taskmigo-client:3000
          E2E_AUTH_ORIGIN: http://taskmigo-web:8080
          E2E_USERNAME: system
        run: |
          set -euo pipefail

          echo "127.0.0.1 taskmigo-client taskmigo-web" | sudo tee -a /etc/hosts >/dev/null
          export NO_PROXY="${NO_PROXY:+$NO_PROXY,}taskmigo-client,taskmigo-web"
          export no_proxy="${no_proxy:+$no_proxy,}taskmigo-client,taskmigo-web"

          kubectl -n "$NAMESPACE" port-forward service/taskmigo-client 3000:3000 \
            >"$RUNNER_TEMP/taskmigo-client-port-forward.log" 2>&1 &
          client_port_forward_pid=$!
          kubectl -n "$NAMESPACE" port-forward service/taskmigo-web 8080:8080 \
            >"$RUNNER_TEMP/taskmigo-web-port-forward.log" 2>&1 &
          web_port_forward_pid=$!

          cleanup() {
            kill "$client_port_forward_pid" "$web_port_forward_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 "$E2E_BASE_URL/" >/dev/null
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 \
            "$E2E_AUTH_ORIGIN/.well-known/openid-configuration" >/dev/null

          export E2E_PASSWORD="$(kubectl -n "$NAMESPACE" get secret taskmigo-secrets \
            -o jsonpath='{.data.bootstrap-user-password}' | base64 --decode)"
          npm --prefix e2e test 2>&1 | tee "$RUNNER_TEMP/playwright.log"

      - name: Kubernetes failure diagnostics
        if: ${{ failure() }}
        run: |
          echo "::group::Kubernetes resources"
          kubectl -n "$NAMESPACE" get all,pvc -o wide || true
          echo "::endgroup::"

          echo "::group::Helm release"
          helm status taskmigo --namespace "$NAMESPACE" || true
          echo "::endgroup::"

          for log in "$RUNNER_TEMP/minikube-start.log" "$RUNNER_TEMP/playwright.log" "$RUNNER_TEMP/taskmigo-client-port-forward.log" "$RUNNER_TEMP/taskmigo-web-port-forward.log"; do
            if [ -f "$log" ]; then
              echo "::group::$(basename "$log")"
              tail -n 200 "$log" || true
              echo "::endgroup::"
            fi
          done

          for pod in $(kubectl -n "$NAMESPACE" get pods -o name 2>/dev/null); do
            echo "::group::Logs $pod"
            kubectl -n "$NAMESPACE" logs "$pod" --all-containers --tail=200 || true
            echo "::endgroup::"
            echo "::group::Describe $pod"
            kubectl -n "$NAMESPACE" describe "$pod" || true
            echo "::endgroup::"
          done

      - name: Upload Playwright failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: |
            ${{ runner.temp }}/minikube-start.log
            ${{ runner.temp }}/playwright.log
            ${{ runner.temp }}/taskmigo-client-port-forward.log
            ${{ runner.temp }}/taskmigo-web-port-forward.log
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: warn
          retention-days: 7
