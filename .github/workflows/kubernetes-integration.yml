name: Kubernetes Integration

on:
  pull_request:
    paths:
      - "Taskfile.yml"
      - "deploy/minikube/**"
      - "helm/**"
      - "server/**"
      - "client/**"
      - "e2e/**"
      - ".github/docker-bake.integration.hcl"
      - ".github/workflows/kubernetes-integration.yml"
  push:
    branches: [next]
    paths:
      - "Taskfile.yml"
      - "deploy/minikube/**"
      - "helm/**"
      - "server/**"
      - "client/**"
      - "e2e/**"
      - ".github/docker-bake.integration.hcl"
      - ".github/workflows/kubernetes-integration.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: true
  PROFILE: minikube
  NAMESPACE: taskmigo-integration
  GATEWAY_NAME: taskmigo-integration
  MINIKUBE_CONTAINER_RUNTIME: docker
  MINIKUBE_CPUS: "4"
  MINIKUBE_DRIVER: docker
  MINIKUBE_MEMORY: 6000m
  MINIKUBE_KUBERNETES_VERSION: v1.35.0

jobs:
  integration:
    name: Deploy and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v4.2.4

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "26.7.0"

      - name: Cache Minikube assets
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.minikube/cache/iso
            ~/.minikube/cache/kic
            ~/.minikube/cache/preloaded-tarball
          key: minikube-1.38.1-v1.35.0-docker-${{ runner.arch }}

      - name: Set up Minikube CLI
        uses: medyagh/setup-minikube@v0.0.21
        with:
          start: false
          cache: false
          minikube-version: 1.38.1

      - name: Set up Task
        uses: go-task/setup-task@v2.2.0
        with:
          version: 3.53.1

      - name: Validate chart
        run: task kubernetes:validate

      - name: Install E2E dependencies
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npm run typecheck
          npx playwright install --with-deps chromium

      - name: Deploy to Minikube
        run: task kubernetes:deploy

      - name: Run Helm integration tests
        run: task kubernetes:test

      - name: Run browser E2E tests
        shell: bash
        run: |
          set -euo pipefail

          minikube_ip="$(minikube -p "$PROFILE" ip)"
          client_host="taskmigo.${minikube_ip}.sslip.io"
          web_host="api.taskmigo.${minikube_ip}.sslip.io"
          e2e_password="$(minikube -p "$PROFILE" kubectl -- -n "$NAMESPACE" get secret taskmigo-secrets \
            -o go-template='{{index .data "bootstrap-user-password" | base64decode}}')"
          proxy_hosts="${client_host},${web_host}"

          export E2E_BASE_URL="http://${client_host}"
          export E2E_AUTH_ORIGIN="http://${web_host}"
          export E2E_USERNAME=system
          export E2E_PASSWORD="$e2e_password"
          export NO_PROXY="${NO_PROXY:+${NO_PROXY},}${proxy_hosts}"
          export no_proxy="${no_proxy:+${no_proxy},}${proxy_hosts}"

          npm --prefix e2e test 2>&1 | tee "${RUNNER_TEMP}/taskmigo-playwright.log"

      - name: Kubernetes failure diagnostics
        if: ${{ failure() }}
        run: task kubernetes:diagnostics

      - name: Upload Playwright failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: |
            ${{ runner.temp }}/taskmigo-playwright.log
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: warn
          retention-days: 7
