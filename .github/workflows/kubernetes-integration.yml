name: Kubernetes Integration

on:
  pull_request:
    paths:
      - "Taskfile.yml"
      - "deploy/minikube/**"
      - "helm/**"
      - "server/**"
      - "client/**"
      - "e2e/**"
      - ".github/docker-bake.integration.hcl"
      - ".github/workflows/kubernetes-integration.yml"
  push:
    branches: [next]
    paths:
      - "Taskfile.yml"
      - "deploy/minikube/**"
      - "helm/**"
      - "server/**"
      - "client/**"
      - "e2e/**"
      - ".github/docker-bake.integration.hcl"
      - ".github/workflows/kubernetes-integration.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: true
  NAMESPACE: taskmigo-integration
  GATEWAY_NAME: taskmigo-integration
  MINIKUBE_CONTAINER_RUNTIME: docker
  MINIKUBE_CPUS: "4"
  MINIKUBE_DRIVER: docker
  MINIKUBE_MEMORY: 6000m
  MINIKUBE_KUBERNETES_VERSION: v1.35.0

jobs:
  integration:
    name: Deploy and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v4.2.4

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "26.7.0"

      - name: Cache Minikube assets
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.minikube/cache/iso
            ~/.minikube/cache/kic
            ~/.minikube/cache/preloaded-tarball
          key: minikube-1.38.1-v1.35.0-docker-${{ runner.arch }}

      - name: Set up Minikube CLI
        uses: medyagh/setup-minikube@v0.0.21
        with:
          start: false
          cache: false
          minikube-version: 1.38.1

      - name: Set up Task
        uses: go-task/setup-task@v2.2.0
        with:
          version: 3.53.1

      - name: Validate chart
        run: task kubernetes:validate

      - name: Install Playwright
        run: task e2e:install

      - name: Deploy to Minikube
        run: task kubernetes:deploy

      - name: Run Kubernetes integration tests
        run: task kubernetes:test

      - name: Kubernetes failure diagnostics
        if: ${{ failure() }}
        run: task kubernetes:diagnostics

      - name: Upload Playwright failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: |
            ${{ runner.temp }}/taskmigo-playwright.log
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: warn
          retention-days: 7
