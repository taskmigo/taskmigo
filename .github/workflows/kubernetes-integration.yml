name: Kubernetes Integration

on:
  pull_request:
    paths:
      - "Taskfile.yml"
      - "deploy/minikube/**"
      - "helm/**"
      - "server/**"
      - "client/**"
      - "e2e/**"
      - ".github/docker-bake.integration.hcl"
      - ".github/workflows/kubernetes-integration.yml"
  push:
    branches: [next]
    paths:
      - "Taskfile.yml"
      - "deploy/minikube/**"
      - "helm/**"
      - "server/**"
      - "client/**"
      - "e2e/**"
      - ".github/docker-bake.integration.hcl"
      - ".github/workflows/kubernetes-integration.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  pull-requests: write

env:
  CI: true
  PROFILE: minikube
  NAMESPACE: taskmigo-integration
  GATEWAY_NAME: taskmigo-integration
  MINIKUBE_CONTAINER_RUNTIME: docker
  MINIKUBE_CPUS: "4"
  MINIKUBE_DRIVER: docker
  MINIKUBE_MEMORY: 6000m
  MINIKUBE_KUBERNETES_VERSION: v1.35.0

jobs:
  integration:
    name: Deploy and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v4.2.4

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "26.7.0"

      - name: Cache Minikube assets
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.minikube/cache/iso
            ~/.minikube/cache/kic
            ~/.minikube/cache/preloaded-tarball
          key: minikube-1.38.1-v1.35.0-docker-${{ runner.arch }}

      - name: Set up and start Minikube
        uses: medyagh/setup-minikube@v0.0.21
        with:
          start: true
          cache: false
          minikube-version: 1.38.1
          driver: ${{ env.MINIKUBE_DRIVER }}
          container-runtime: ${{ env.MINIKUBE_CONTAINER_RUNTIME }}
          kubernetes-version: ${{ env.MINIKUBE_KUBERNETES_VERSION }}
          cpus: ${{ env.MINIKUBE_CPUS }}
          memory: ${{ env.MINIKUBE_MEMORY }}

      - name: Set up Task
        uses: go-task/setup-task@v2.2.0
        with:
          version: 3.53.1

      - name: Validate chart
        run: task kubernetes:validate

      - name: Install and validate E2E
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npm run typecheck
          npm run report:test
          npx playwright install --with-deps chromium

      - name: Locate baseline E2E report
        id: e2e-baseline
        env:
          BASELINE_BRANCH: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if ! run_ids="$(gh run list \
            --workflow kubernetes-integration.yml \
            --branch "$BASELINE_BRANCH" \
            --status success \
            --limit 20 \
            --json databaseId \
            --jq '.[].databaseId' 2>/dev/null)"; then
            echo "::notice::No baseline workflow is available on $BASELINE_BRANCH yet."
            exit 0
          fi

          for run_id in $run_ids; do
            artifact_id="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
              --jq '[.artifacts[] | select(.name == "e2e-json-report" and .expired == false)][0].id // empty')"
            if [ -n "$artifact_id" ]; then
              echo "artifact-id=$artifact_id" >>"$GITHUB_OUTPUT"
              echo "run-id=$run_id" >>"$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "::notice::No unexpired baseline E2E report was found on $BASELINE_BRANCH."

      - name: Download baseline E2E report
        if: ${{ steps.e2e-baseline.outputs.artifact-id != '' }}
        uses: actions/download-artifact@v8.0.0
        with:
          artifact-ids: ${{ steps.e2e-baseline.outputs.artifact-id }}
          path: ${{ runner.temp }}/e2e-baseline
          github-token: ${{ github.token }}

      - name: Deploy to Minikube
        run: task kubernetes:deploy

      - name: Run Helm integration tests
        run: task kubernetes:test

      - name: Run browser E2E tests
        shell: bash
        run: |
          set -euo pipefail

          minikube_ip="$(minikube -p "$PROFILE" ip)"
          client_host="taskmigo.${minikube_ip}.sslip.io"
          web_host="api.taskmigo.${minikube_ip}.sslip.io"
          e2e_password="$(minikube -p "$PROFILE" kubectl -- -n "$NAMESPACE" get secret taskmigo-secrets \
            -o go-template='{{index .data "bootstrap-user-password" | base64decode}}')"
          proxy_hosts="${client_host},${web_host}"

          export E2E_BASE_URL="http://${client_host}"
          export E2E_AUTH_ORIGIN="http://${web_host}"
          export E2E_USERNAME=system
          export E2E_PASSWORD="$e2e_password"
          export NO_PROXY="${NO_PROXY:+${NO_PROXY},}${proxy_hosts}"
          export no_proxy="${no_proxy:+${no_proxy},}${proxy_hosts}"

          npm --prefix e2e test 2>&1 | tee "${RUNNER_TEMP}/taskmigo-playwright.log"

      - name: Kubernetes failure diagnostics
        if: ${{ failure() }}
        run: task kubernetes:diagnostics

      - name: Build E2E summary and baseline diff
        if: ${{ always() }}
        env:
          BASELINE_RUN_ID: ${{ steps.e2e-baseline.outputs.run-id }}
        shell: bash
        run: |
          set -euo pipefail

          arguments=(
            --current e2e/test-results/results.json
            --output e2e-report.md
            --run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          )
          if [ -f "$RUNNER_TEMP/e2e-baseline/results.json" ]; then
            arguments+=(
              --baseline "$RUNNER_TEMP/e2e-baseline/results.json"
              --baseline-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$BASELINE_RUN_ID"
            )
          fi

          node e2e/scripts/report.mjs "${arguments[@]}"
          cat e2e-report.md >>"$GITHUB_STEP_SUMMARY"

      - name: Comment E2E report on pull request
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v9.0.0
        env:
          E2E_REPORT_PATH: e2e-report.md
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- taskmigo-e2e-report -->";
            const body = marker + "\n" + fs.readFileSync(process.env.E2E_REPORT_PATH, "utf8");

            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
              const previous = comments.find(
                (comment) =>
                  comment.user?.type === "Bot" && comment.body?.includes(marker),
              );

              if (previous) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: previous.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            } catch (error) {
              core.warning("Could not publish the E2E pull request comment: " + error.message);
            }

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: |
            ${{ runner.temp }}/taskmigo-playwright.log
            e2e/playwright-report
            e2e/test-results
            e2e-report.md
          if-no-files-found: warn
          retention-days: 7

      - name: Upload E2E JSON report
        if: ${{ always() && hashFiles('e2e/test-results/results.json') != '' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-json-report
          path: e2e/test-results/results.json
          if-no-files-found: error
          retention-days: 30
