name: Feature request
description: Propose a concrete product, platform, or developer-experience improvement.
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the desired outcome. A proposed implementation is useful but should not constrain better solutions.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation, friction, or unmet need are you trying to address?
      placeholder: Describe the current situation and who it affects.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the behavior or capability you want, independent of implementation details where possible.
      placeholder: What should become possible or easier?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Optional. Share an implementation direction, API shape, UX, or architecture if you have one.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Describe workarounds or competing approaches you considered and their tradeoffs.
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List observable conditions that would make this issue complete.
      placeholder: |
        - ...
        - ...
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add diagrams, examples, links, compatibility constraints, or other relevant context.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing open and closed issues for duplicates.
          required: true
        - label: This request describes a problem and desired outcome, not only a preferred implementation.
          required: true
