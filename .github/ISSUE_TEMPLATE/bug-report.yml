name: Bug report
description: Report reproducible incorrect or unexpected behavior.
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please provide enough detail for someone else to reproduce and verify it.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem and its impact concisely.
      placeholder: What is broken, and why does it matter?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that reproduces the issue.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened instead?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include only details relevant to reproducing the problem.
      placeholder: |
        - Commit/branch:
        - Runtime/browser/OS:
        - Configuration:
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Logs or supporting evidence
      description: Add concise logs, stack traces, screenshots, links, or other evidence. Remove secrets and sensitive data.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add anything else that would help diagnose the issue.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing open and closed issues for duplicates.
          required: true
        - label: I removed secrets and sensitive data from the report.
          required: true
