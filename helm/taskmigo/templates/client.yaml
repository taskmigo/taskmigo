{{- if .Values.client.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taskmigo.fullname" . }}-client
  labels:
    {{- include "taskmigo.labels" . | nindent 4 }}
    app.kubernetes.io/component: client
spec:
  replicas: {{ .Values.client.replicas }}
  selector:
    matchLabels:
      {{- include "taskmigo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: client
  template:
    metadata:
      labels:
        {{- include "taskmigo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: client
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "taskmigo.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.client.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: client
          image: "{{ .Values.client.image.repository }}:{{ default .Chart.AppVersion .Values.client.image.tag }}"
          imagePullPolicy: {{ .Values.client.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: TASKMIGO_CLIENT_URL
              value: {{ include "taskmigo.clientUrl" . | quote }}
            - name: TASKMIGO_AUTH_ISSUER
              value: {{ include "taskmigo.clientIssuer" . | quote }}
            - name: TASKMIGO_AUTH_CLIENT_ID
              value: {{ .Values.client.auth.clientId | quote }}
            - name: TASKMIGO_AUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.client.auth.clientSecretKey | quote }}
            - name: TASKMIGO_AUTH_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.client.auth.sessionSecretKey | quote }}
            - name: TASKMIGO_AUTH_ALLOW_INSECURE_REQUESTS
              value: {{ .Values.client.auth.allowInsecureRequests | quote }}
            - name: TASKMIGO_AUTH_SCOPE
              value: {{ .Values.client.auth.scope | quote }}
            - name: TASKMIGO_AUTH_OIDC_STATE_VERSION
              value: {{ .Values.client.auth.oidcStateVersion | quote }}
            - name: TASKMIGO_AUTH_CALLBACK_PATH
              value: {{ .Values.client.auth.callbackPath | quote }}
            - name: TASKMIGO_AUTH_POST_LOGOUT_REDIRECT_PATH
              value: {{ .Values.client.auth.postLogoutRedirectPath | quote }}
            - name: TASKMIGO_AUTH_DEFAULT_RETURN_TO
              value: {{ .Values.client.auth.defaultReturnTo | quote }}
            - name: TASKMIGO_AUTH_RETURN_TO_PARAMETER
              value: {{ .Values.client.auth.returnToParameter | quote }}
            - name: TASKMIGO_AUTH_REFRESH_SKEW_MILLISECONDS
              value: {{ .Values.client.auth.refreshSkewMilliseconds | quote }}
            - name: TASKMIGO_AUTH_COOKIE_VERSION
              value: {{ .Values.client.auth.cookie.version | quote }}
            - name: TASKMIGO_AUTH_COOKIE_HTTP_ONLY
              value: {{ .Values.client.auth.cookie.httpOnly | quote }}
            - name: TASKMIGO_AUTH_COOKIE_SAME_SITE
              value: {{ .Values.client.auth.cookie.sameSite | quote }}
            - name: TASKMIGO_AUTH_COOKIE_SECURE
              value: {{ .Values.client.auth.cookie.secure | quote }}
            - name: TASKMIGO_AUTH_COOKIE_PATH
              value: {{ .Values.client.auth.cookie.path | quote }}
            - name: TASKMIGO_AUTH_SESSION_COOKIE_NAME
              value: {{ .Values.client.auth.cookie.sessionName | quote }}
            - name: TASKMIGO_AUTH_SESSION_COOKIE_AAD
              value: {{ .Values.client.auth.cookie.sessionAad | quote }}
            - name: TASKMIGO_AUTH_SESSION_MAX_AGE_SECONDS
              value: {{ .Values.client.auth.cookie.sessionMaxAgeSeconds | quote }}
            - name: TASKMIGO_AUTH_TRANSACTION_COOKIE_NAME
              value: {{ .Values.client.auth.cookie.transactionName | quote }}
            - name: TASKMIGO_AUTH_TRANSACTION_COOKIE_AAD
              value: {{ .Values.client.auth.cookie.transactionAad | quote }}
            - name: TASKMIGO_AUTH_TRANSACTION_MAX_AGE_SECONDS
              value: {{ .Values.client.auth.cookie.transactionMaxAgeSeconds | quote }}
            {{- with .Values.client.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.client.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskmigo.fullname" . }}-client
  labels:
    {{- include "taskmigo.labels" . | nindent 4 }}
    app.kubernetes.io/component: client
spec:
  type: {{ .Values.client.service.type }}
  selector:
    {{- include "taskmigo.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: client
  ports:
    - name: http
      port: {{ .Values.client.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
