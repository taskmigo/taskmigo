{{- if .Values.web.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "taskmigo.fullname" . }}-web
  labels:
    {{- include "taskmigo.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  accessModes:
    {{- toYaml .Values.web.persistence.accessModes | nindent 4 }}
  {{- if .Values.web.persistence.storageClass }}
  storageClassName: {{ .Values.web.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.web.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taskmigo.fullname" . }}-web
  labels:
    {{- include "taskmigo.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "taskmigo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "taskmigo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "taskmigo.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ default .Chart.AppVersion .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- include "taskmigo.databaseEnv" . | nindent 12 }}
            - name: SPRING_SECURITY_OAUTH2_AUTHORIZATIONSERVER_ISSUER
              value: {{ include "taskmigo.webUrl" . | quote }}
            - name: TASKMIGO_OAUTH_SIGNING_KEY_FILE
              value: {{ .Values.web.signingKey.path | quote }}
            - name: TASKMIGO_OAUTH_SIGNING_KEY_ID
              value: {{ .Values.web.signingKey.id | quote }}
            - name: TASKMIGO_OAUTH_SIGNING_KEY_AUTO_CREATE
              value: {{ .Values.web.signingKey.autoCreate | quote }}
            {{- with .Values.web.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
            - name: signing-key
              mountPath: /var/lib/taskmigo
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
      volumes:
        - name: signing-key
          {{- if .Values.web.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "taskmigo.fullname" . }}-web
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskmigo.fullname" . }}-web
  labels:
    {{- include "taskmigo.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type }}
  selector:
    {{- include "taskmigo.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
