{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "taskmigo.fullname" . }}-test
  labels:
    {{- include "taskmigo.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: smoke-test
      image: "{{ .Values.tests.image.repository }}:{{ .Values.tests.image.tag }}"
      imagePullPolicy: {{ .Values.tests.image.pullPolicy }}
      securityContext:
        {{- toYaml .Values.containerSecurityContext | nindent 8 }}
      env:
        - name: WEB_URL
          value: "http://{{ include "taskmigo.fullname" . }}-web:{{ .Values.web.service.port }}"
        {{- if .Values.client.enabled }}
        - name: CLIENT_URL
          value: "http://{{ include "taskmigo.fullname" . }}-client:{{ .Values.client.service.port }}"
        {{- end }}
        {{- if .Values.tests.oauthClient.enabled }}
        - name: TEST_CLIENT_ID
          value: {{ .Values.tests.oauthClient.clientId | quote }}
        - name: TEST_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Values.database.existingSecret | quote }}
              key: {{ .Values.tests.oauthClient.clientSecretKey | quote }}
        {{- end }}
      command:
        - /bin/sh
        - -ec
        - |
          curl -fsS "$WEB_URL/.well-known/openid-configuration" | grep -q '"issuer"'

          status="$(curl -sS -o /tmp/unauthorized.json -w '%{http_code}' "$WEB_URL/api/v0/permissions")"
          test "$status" = "401"
          grep -q '"security.unauthorized"' /tmp/unauthorized.json

          {{- if .Values.tests.oauthClient.enabled }}
          token_response="$(curl -fsS \
            -u "$TEST_CLIENT_ID:$TEST_CLIENT_SECRET" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode grant_type=client_credentials \
            --data-urlencode scope=taskmigo.api \
            "$WEB_URL/oauth2/token")"
          token="$(printf '%s' "$token_response" | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')"
          test -n "$token"
          curl -fsS -H "Authorization: Bearer $token" "$WEB_URL/api/v0/permissions" | grep -q '"success":true'
          {{- end }}

          {{- if .Values.client.enabled }}
          curl -fsS "$CLIENT_URL/" >/dev/null
          {{- end }}
{{- end }}
