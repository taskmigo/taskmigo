server:
  port: ${SERVER_PORT:9000}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/taskmigo}
    username: ${DATABASE_USERNAME:taskmigo}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  security:
    bootstrap:
      username: ${BOOTSTRAP_USERNAME:developer}
      password: ${BOOTSTRAP_PASSWORD}
