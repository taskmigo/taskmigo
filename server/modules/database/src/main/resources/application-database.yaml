spring:
  datasource:
    url: ${TASKMIGO_DATABASE_URL:jdbc:postgresql://localhost:5432/taskmigo}
    username: ${TASKMIGO_DATABASE_USERNAME:taskmigo}
    password: ${TASKMIGO_DATABASE_PASSWORD:taskmigo}
    hikari:
      maximum-pool-size: ${TASKMIGO_DATABASE_MAX_POOL_SIZE:10}
      connection-timeout: ${TASKMIGO_DATABASE_CONNECTION_TIMEOUT:30000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
