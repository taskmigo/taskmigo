---
spring:
  # JobRunr outbox externalization is the durable audit handoff. The classic
  # EventPublicationRegistry lifecycle is a separate subsystem and is intentionally
  # not activated by this application.
  autoconfigure:
    exclude:
      - org.springframework.modulith.events.config.EventPublicationAutoConfiguration
  threads:
    virtual:
      enabled: true
  config:
    import: classpath:application-database.yaml
  modulith:
    events:
      externalization:
        mode: outbox

scalar:
  enabled: true
  sources:
    - url: /api/docs/openapi.yaml
      title: Taskmigo API v0
      slug: v0
      default: true
  path: /api/docs
  page-title: Taskmigo API Reference
  show-developer-tools: never
  telemetry: false
  hide-models: true
  agent:
    disabled: true

taskmigo:
  audit:
    enabled: true
  oauth:
    signing-key-file: ${TASKMIGO_OAUTH_SIGNING_KEY_FILE:./data/oauth-signing-key.pem}
    signing-key-id: ${TASKMIGO_OAUTH_SIGNING_KEY_ID:primary}
    signing-key-auto-create: ${TASKMIGO_OAUTH_SIGNING_KEY_AUTO_CREATE:false}

jobrunr:
  database:
    skip-create: true
  background-job-server:
    enabled: false
