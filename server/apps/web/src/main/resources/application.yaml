spring:
  config:
    import: classpath:application-database.yaml

springdoc:
  api-docs:
    path: /api/docs/openapi.json

scalar:
  enabled: true
  sources:
    - url: /api/docs/openapi.json/v0
      title: Taskmigo API v0
      slug: v0
      default: true
  path: /api/docs
  page-title: Taskmigo API Reference
  show-developer-tools: never
  telemetry: false
  agent:
    disabled: true

taskmigo:
  security:
    signing-key-file: ${TASKMIGO_OAUTH_SIGNING_KEY_FILE:./data/oauth-signing-key.pem}
    signing-key-id: ${TASKMIGO_OAUTH_SIGNING_KEY_ID:primary}
    signing-key-auto-create: ${TASKMIGO_OAUTH_SIGNING_KEY_AUTO_CREATE:false}
    browser-authentication:
      enabled: ${TASKMIGO_AUTH_BROWSER_ENABLED:false}
      client-secret: ${TASKMIGO_AUTH_CLIENT_SECRET:}
      client-url: ${TASKMIGO_CLIENT_URL:http://localhost:3000}
      development-user:
        enabled: ${TASKMIGO_AUTH_DEVELOPMENT_USER_ENABLED:false}
        username: ${TASKMIGO_AUTH_DEVELOPMENT_USER_USERNAME:developer}
        password: ${TASKMIGO_AUTH_DEVELOPMENT_USER_PASSWORD:}
