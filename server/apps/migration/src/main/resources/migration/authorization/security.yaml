---
clients:
  browser:
    registration:
      client-id: taskmigo-client
      # yamllint disable-line rule:quoted-strings
      client-secret: "${TASKMIGO_AUTH_CLIENT_SECRET_HASH}"
      client-name: Taskmigo browser client
      client-authentication-methods:
        - client_secret_basic
      authorization-grant-types:
        - authorization_code
        - refresh_token
      redirect-uris:
        # yamllint disable-line rule:quoted-strings
        - "${TASKMIGO_CLIENT_URL}/api/auth/callback"
      post-logout-redirect-uris:
        # yamllint disable-line rule:quoted-strings
        - "${TASKMIGO_CLIENT_URL}/"
      scopes:
        - openid
        - profile
    require-proof-key: true
    require-authorization-consent: false
    token:
      access-token-time-to-live: PT5M
      refresh-token-time-to-live: PT8H
      reuse-refresh-tokens: false
