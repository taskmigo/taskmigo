clients:
  cli:
    registration:
      client-id: "${TASKMIGO_MACHINE_CLIENT_ID}"
      client-secret: "${TASKMIGO_MACHINE_CLIENT_SECRET_HASH}"
      client-name: Taskmigo machine client
      client-authentication-methods:
        - client_secret_basic
      authorization-grant-types:
        - client_credentials
      scopes: []
    require-proof-key: false
    require-authorization-consent: false
    token:
      access-token-time-to-live: PT1H

  browser:
    registration:
      client-id: taskmigo-client
      client-secret: "${TASKMIGO_AUTH_CLIENT_SECRET_HASH}"
      client-name: Taskmigo browser client
      client-authentication-methods:
        - client_secret_basic
      authorization-grant-types:
        - authorization_code
        - refresh_token
      redirect-uris:
        - "${TASKMIGO_CLIENT_URL}/api/auth/callback"
      post-logout-redirect-uris:
        - "${TASKMIGO_CLIENT_URL}/"
      scopes:
        - openid
        - profile
    require-proof-key: true
    require-authorization-consent: false
    token:
      access-token-time-to-live: PT5M
      refresh-token-time-to-live: PT8H
      reuse-refresh-tokens: false
