---
- code: system_operator_request_all
  description: Allows System Operator to call every versioned API.
  effect: allow
  scope: request
  target:
    api:
      method: "*"
      path: /api/v0/.*
  policy: return true;
  absent: false

- code: system_operator_object_all
  description: Allows System Operator to read every object returned by versioned GET APIs.
  effect: allow
  scope: object
  target:
    api:
      method: GET
      path: /api/v0/.*
  policy: true
  absent: false

- code: administrator_request_all
  description: Allows Administrator to call every versioned API.
  effect: allow
  scope: request
  target:
    api:
      method: "*"
      path: /api/v0/.*
  policy: return true;
  absent: false

- code: administrator_object_all
  description: Allows Administrator to read objects returned by versioned GET APIs.
  effect: allow
  scope: object
  target:
    api:
      method: GET
      path: /api/v0/.*
  policy: true
  absent: false

- code: administrator_hide_system_user
  description: Prevents Administrator from seeing the system user through the users API.
  effect: deny
  scope: object
  target:
    api:
      method: "*"
      path: /api/v0/users
  policy: object.username == "system"
  absent: false

- code: user_mutation_object_allow
  description: Allows authorized operators to target User mutation objects.
  effect: allow
  scope: object
  target:
    api:
      method: "*"
      path: /api/v0/users/.*
  policy: true
  absent: false

- code: user_mutation_deny_retained
  description: Prevents mutation or repeated deletion of retained Users.
  effect: deny
  scope: object
  target:
    api:
      method: "*"
      path: /api/v0/users/.*
  policy: object.status == "RETAINED"
  absent: false

- code: user_delete_deny_system
  description: Prevents deletion of the persisted system User.
  effect: deny
  scope: object
  target:
    api:
      method: DELETE
      path: /api/v0/users/.*
  policy: object.username == "system"
  absent: false
