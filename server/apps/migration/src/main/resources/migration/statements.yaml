---
- code: system_operator_request_all
  description: Allows System Operator to call every versioned API.
  effect: allow
  scope: request
  target:
    api:
      method: "*"
      path: /api/v0/.*
  policy: return true;
  absent: false

- code: system_operator_object_all
  description: Allows System Operator to read every object returned by versioned APIs.
  effect: allow
  scope: object
  target:
    api:
      method: "*"
      path: /api/v0/.*
  policy: return true;
  absent: false

- code: administrator_request_all
  description: Allows Administrator to call every versioned API.
  effect: allow
  scope: request
  target:
    api:
      method: "*"
      path: /api/v0/.*
  policy: return true;
  absent: false

- code: administrator_object_all
  description: Allows Administrator to read objects returned by versioned APIs.
  effect: allow
  scope: object
  target:
    api:
      method: "*"
      path: /api/v0/.*
  policy: return true;
  absent: false

- code: administrator_hide_system_user
  description: Prevents Administrator from seeing the system user through the users API.
  effect: deny
  scope: object
  target:
    api:
      method: "*"
      path: /api/v0/users
  policy: |
    return object.username == "system";
  absent: false
