spring:
  config:
    import: classpath:application-core.yaml

springdoc:
  api-docs:
    path: /api/docs/openapi.json

scalar:
  enabled: true
  url: /api/docs/openapi.json
  path: /api/docs
  page-title: Taskmigo API Reference
  telemetry: false
  agent:
    disabled: true

taskmigo:
  security:
    issuer: ${TASKMIGO_ISSUER:http://localhost:8080}
    signing-key-file: ${TASKMIGO_OAUTH_SIGNING_KEY_FILE:./data/oauth-signing-key.pem}
    signing-key-id: ${TASKMIGO_OAUTH_SIGNING_KEY_ID:primary}
    signing-key-auto-create: ${TASKMIGO_OAUTH_SIGNING_KEY_AUTO_CREATE:false}
    authorization-cleanup:
      interval: ${TASKMIGO_OAUTH_AUTHORIZATION_CLEANUP_INTERVAL:PT1H}
      retention: ${TASKMIGO_OAUTH_AUTHORIZATION_RETENTION:P7D}
    internal-clients:
      cli:
        client-id: ${TASKMIGO_OAUTH_CLIENT_ID:cli}
        client-secret: ${TASKMIGO_OAUTH_CLIENT_SECRET:}
        enabled: true
        configuration-version: ${TASKMIGO_OAUTH_CLIENT_CONFIGURATION_VERSION:1}
        scopes:
          - taskmigo.api
        service-permissions:
          - system.resources.manage
