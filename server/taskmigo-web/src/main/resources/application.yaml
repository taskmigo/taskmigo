spring:
  config:
    import: classpath:application-core.yaml

springdoc:
  api-docs:
    path: /api/docs/openapi.json

scalar:
  enabled: true
  url: /api/docs/openapi.json
  path: /api/docs
  page-title: Taskmigo API Reference
  telemetry: false
  agent:
    disabled: true

taskmigo:
  security:
    issuer: ${TASKMIGO_ISSUER:http://localhost:8080}
    client-id: ${TASKMIGO_OAUTH_CLIENT_ID:taskmigo-cli}
    client-secret: ${TASKMIGO_OAUTH_CLIENT_SECRET:taskmigo-dev-secret}
